name: Deploy Firebase Hosting
on:
  push:
    branches:
      - main
    paths-ignore:
      - "rasid-rebuild/**"
      - ".github/workflows/validate-rasid-rebuild.yml"
      - ".github/workflows/deploy-firebase-hosting.yml"
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy main Rasid site
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FIR_RC_91DBC }}
          projectId: fir-rc-91dbc
          target: rasid-main
          channelId: live
      - name: Deploy legacy URL with the same safe build
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FIR_RC_91DBC }}
          projectId: fir-rc-91dbc
          target: rasid-legacy
          channelId: live
