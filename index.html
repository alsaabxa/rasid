<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>منصة راصد لرصد الغياب — متوسطة آبي شعيب بمكة المكرمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#102a43;
  --teal:#0f766e;
  --gold:#eab308;
  --bg1:#f6fafc;
  --bg2:#edf7f5;
  --text:#183247;
  --white:#ffffff;
  --danger:#dc2626;
  --danger-bg:#fef2f2;
  --success:#16a34a;
  --success-bg:#f0fdf4;
  --line:#dbe6ec;
  --radius:16px;
  --shadow:0 8px 24px -8px rgba(16,42,67,.18);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Cairo',sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--text);
  min-height:100vh;
  direction:rtl;
}
button, input, select{font-family:inherit; font-size:1rem;}
button{cursor:pointer; border:none; background:none;}
a{color:inherit; text-decoration:none;}
::selection{background:var(--gold); color:var(--navy);}

/* ---------- Header ---------- */
.topbar{
  background:var(--navy);
  color:#fff;
  padding:14px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  position:sticky; top:0; z-index:40;
  box-shadow:0 4px 18px -6px rgba(0,0,0,.35);
}
.brand{display:flex; align-items:center; gap:12px;}
.brand-mark{
  width:44px; height:44px; border-radius:12px;
  background:linear-gradient(135deg,var(--teal),var(--navy));
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:1.3rem; color:var(--gold);
  border:2px solid rgba(234,179,8,.5);
}
.brand-text h1{font-size:1.05rem; font-weight:800; letter-spacing:.2px;}
.brand-text p{font-size:.75rem; color:#c7d7e0; font-weight:500;}
.clock{
  display:flex; align-items:center; gap:14px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);
  padding:8px 16px; border-radius:12px;
  font-size:.85rem;
}
.clock .time{font-size:1.15rem; font-weight:700; color:var(--gold); font-variant-numeric:tabular-nums;}
.clock .dates{display:flex; flex-direction:column; gap:2px; color:#dce9ee; line-height:1.3;}
.topnav{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.nav-btn{
  color:#e7eff3; padding:8px 14px; border-radius:10px; font-weight:600; font-size:.9rem;
  transition:background .15s;
}
.nav-btn:hover{background:rgba(255,255,255,.1);}
.nav-btn.active{background:var(--teal); color:#fff;}
.user-chip{
  display:flex; align-items:center; gap:10px;
  background:rgba(255,255,255,.08); padding:6px 12px; border-radius:999px;
  font-size:.85rem;
}
.user-chip .dot{width:8px; height:8px; border-radius:50%; background:var(--gold);}
.logout-btn{color:#f2b8b8; font-weight:700; font-size:.85rem;}

/* ---------- Layout ---------- */
.container{max-width:1240px; margin:0 auto; padding:26px 20px 60px;}
.page-title{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;}
.page-title h2{font-size:1.4rem; font-weight:800; color:var(--navy);}
.page-title p{color:#5b7382; font-size:.9rem;}

/* ---------- Stat cards ---------- */
.stats-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:28px;}
@media(max-width:800px){.stats-grid{grid-template-columns:repeat(2,1fr);}}
.stat-card{
  background:#fff; border-radius:var(--radius); padding:18px 20px;
  box-shadow:var(--shadow); border-top:4px solid var(--teal);
  display:flex; flex-direction:column; gap:6px;
}
.stat-card.gold{border-top-color:var(--gold);}
.stat-card.danger{border-top-color:var(--danger);}
.stat-card.navy{border-top-color:var(--navy);}
.stat-card .num{font-size:1.9rem; font-weight:800; color:var(--navy);}
.stat-card .lbl{color:#5b7382; font-size:.85rem; font-weight:600;}

/* ---------- Class cards ---------- */
.classes-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:18px;}
.class-card{
  background:#fff; border-radius:var(--radius); box-shadow:var(--shadow);
  overflow:hidden; display:flex; flex-direction:column;
}
.class-card .cc-top{height:6px; background:linear-gradient(90deg,var(--teal),var(--navy));}
.class-card .cc-body{padding:18px; display:flex; flex-direction:column; gap:12px;}
.cc-head{display:flex; align-items:center; justify-content:space-between;}
.cc-head h3{font-size:1.05rem; font-weight:800; color:var(--navy);}
.cc-menu{position:relative;}
.cc-menu-btn{color:#8299a6; font-size:1.2rem; padding:2px 8px; border-radius:6px;}
.cc-menu-btn:hover{background:#eef3f5;}
.cc-menu-list{
  position:absolute; left:0; top:28px; background:#fff; border-radius:10px;
  box-shadow:var(--shadow); border:1px solid var(--line); min-width:140px; z-index:10; display:none; overflow:hidden;
}
.cc-menu-list.open{display:block;}
.cc-menu-list button{display:block; width:100%; text-align:right; padding:10px 14px; font-size:.85rem; font-weight:600;}
.cc-menu-list button:hover{background:#f4f8f9;}
.progress-wrap{background:#eef3f5; border-radius:999px; height:9px; overflow:hidden;}
.progress-bar{height:100%; background:linear-gradient(90deg,var(--teal),var(--success)); border-radius:999px; transition:width .4s;}
.cc-nums{display:flex; justify-content:space-between; font-size:.78rem; color:#5b7382; font-weight:600;}
.cc-nums b{color:var(--navy);}
.cc-actions{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}
.cc-actions button{
  background:var(--bg1); border:1px solid var(--line); border-radius:9px; padding:8px 4px;
  font-size:.72rem; font-weight:700; color:var(--navy); display:flex; flex-direction:column; align-items:center; gap:2px;
}
.cc-actions button:hover{background:#e4f1ee; border-color:var(--teal);}
.cc-actions button.primary{background:var(--teal); color:#fff; border-color:var(--teal);}
.cc-actions button.primary:hover{background:#0c5f58;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:10px 18px; border-radius:10px;
  font-weight:700; font-size:.9rem; transition:transform .1s, box-shadow .15s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--teal); color:#fff; box-shadow:0 6px 16px -6px rgba(15,118,110,.5);}
.btn-primary:hover{background:#0c5f58;}
.btn-gold{background:var(--gold); color:var(--navy); box-shadow:0 6px 16px -6px rgba(234,179,8,.5);}
.btn-gold:hover{background:#c99a06;}
.btn-outline{background:#fff; color:var(--navy); border:1.5px solid var(--line);}
.btn-outline:hover{border-color:var(--teal); color:var(--teal);}
.btn-danger{background:var(--danger-bg); color:var(--danger); border:1.5px solid #fecaca;}
.btn-danger:hover{background:#fee2e2;}
.btn-sm{padding:7px 12px; font-size:.8rem;}
.btn[disabled]{opacity:.5; cursor:not-allowed;}

/* ---------- Login ---------- */
.login-wrap{min-height:calc(100vh - 76px); display:flex; align-items:center; justify-content:center; padding:20px;}
.login-card{
  background:#fff; border-radius:22px; box-shadow:var(--shadow); width:100%; max-width:400px;
  padding:36px 32px; text-align:center;
}
.login-card .brand-mark{margin:0 auto 14px; width:60px; height:60px; font-size:1.7rem;}
.login-card h2{color:var(--navy); font-size:1.3rem; font-weight:800; margin-bottom:4px;}
.login-card p.sub{color:#5b7382; font-size:.85rem; margin-bottom:26px;}
.field{text-align:right; margin-bottom:14px;}
.field label{display:block; font-size:.8rem; font-weight:700; color:var(--navy); margin-bottom:6px;}
.field input, .field select{
  width:100%; padding:11px 14px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg1);
  outline:none; transition:border .15s;
}
.field input:focus, .field select:focus{border-color:var(--teal); background:#fff;}
.login-tabs{display:flex; gap:8px; margin-bottom:20px; background:var(--bg1); padding:4px; border-radius:12px;}
.login-tabs button{flex:1; padding:9px; border-radius:9px; font-weight:700; font-size:.85rem; color:#5b7382;}
.login-tabs button.active{background:#fff; color:var(--navy); box-shadow:0 2px 8px rgba(0,0,0,.08);}
.login-error{color:var(--danger); font-size:.82rem; font-weight:600; margin-bottom:10px; min-height:1em;}

/* ---------- Modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(16,42,67,.55); display:flex; align-items:center; justify-content:center;
  z-index:100; padding:16px; backdrop-filter:blur(2px);
}
.modal{
  background:#fff; border-radius:20px; width:100%; max-width:560px; max-height:90vh; overflow:auto;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.4);
}
.modal.wide{max-width:820px;}
.modal-head{
  padding:20px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; background:#fff; z-index:2;
}
.modal-head h3{font-size:1.1rem; font-weight:800; color:var(--navy);}
.modal-close{font-size:1.3rem; color:#8299a6; padding:4px 10px; border-radius:8px;}
.modal-close:hover{background:#f2f5f6;}
.modal-body{padding:22px 24px;}
.modal-foot{padding:16px 24px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:520px){.two-col{grid-template-columns:1fr;}}

/* ---------- Tables / lists ---------- */
.list-row{
  display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-radius:10px;
  border:1px solid var(--line); margin-bottom:8px;
}
.list-row .info b{display:block; color:var(--navy); font-size:.92rem;}
.list-row .info span{color:#5b7382; font-size:.78rem;}
.row-actions{display:flex; gap:6px;}
.icon-btn{width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#5b7382; background:var(--bg1);}
.icon-btn:hover{background:#e4f1ee; color:var(--teal);}
.icon-btn.del:hover{background:var(--danger-bg); color:var(--danger);}
.searchbox{
  width:100%; padding:11px 14px; border-radius:10px; border:1.5px solid var(--line); margin-bottom:14px; background:var(--bg1);
}
.chip-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.chip{
  padding:5px 10px; border-radius:999px; border:1.5px solid var(--line); font-size:.75rem; font-weight:700; color:#5b7382; cursor:pointer;
}
.chip.selected{background:var(--teal); color:#fff; border-color:var(--teal);}

/* ---------- Dropzone ---------- */
.dropzone{
  border:2px dashed var(--line); border-radius:14px; padding:26px; text-align:center; color:#5b7382; font-size:.85rem;
  transition:border-color .15s, background .15s; margin-top:14px; cursor:pointer;
}
.dropzone.drag{border-color:var(--teal); background:#f0faf8;}
.dropzone b{color:var(--teal); display:block; margin-bottom:4px; font-size:.95rem;}

/* ---------- Scan page ---------- */
.scan-wrap{max-width:640px; margin:0 auto; padding:26px 18px 60px;}
.scan-head{
  background:linear-gradient(135deg,var(--navy),#183f5f); color:#fff; border-radius:20px; padding:26px 24px; margin-bottom:20px;
  text-align:center; box-shadow:0 14px 30px -14px rgba(16,42,67,.5); position:relative; overflow:hidden;
}
.scan-head::after{
  content:''; position:absolute; inset:0; background:radial-gradient(circle at 30% -10%, rgba(234,179,8,.25), transparent 60%);
  pointer-events:none;
}
.scan-head h2{font-size:1.3rem; font-weight:800; position:relative;}
.scan-head p{font-size:.85rem; color:#cfe0e8; margin-top:4px; position:relative;}
.teacher-field{margin-top:16px; position:relative;}
.teacher-field input, .teacher-field select{
  width:100%; padding:11px 14px; border-radius:10px; border:none; text-align:center; font-weight:700; color:var(--navy);
}
.student-item{
  display:flex; align-items:center; justify-content:space-between; background:#fff; border-radius:14px; padding:14px 16px;
  margin-bottom:10px; box-shadow:0 3px 10px -4px rgba(16,42,67,.12); border:2px solid transparent; transition:.15s;
}
.student-item.absent{border-color:var(--danger); background:var(--danger-bg);}
.student-item .s-info{display:flex; align-items:center; gap:12px;}
.student-item .s-num{
  width:34px; height:34px; border-radius:9px; background:var(--bg1); display:flex; align-items:center; justify-content:center;
  font-weight:800; color:var(--navy); font-size:.85rem;
}
.student-item.absent .s-num{background:var(--danger); color:#fff;}
.student-item .s-name{font-weight:700; color:var(--navy);}
.absent-toggle{
  width:56px; height:30px; border-radius:999px; background:#e2ecef; position:relative; transition:.2s; flex-shrink:0;
}
.absent-toggle::after{
  content:'حاضرة'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:.62rem; font-weight:800; color:#5b7382;
}
.absent-toggle.on{background:var(--danger);}
.absent-toggle.on::after{content:'غائبة'; color:#fff;}
.scan-submit-bar{position:sticky; bottom:14px; margin-top:18px;}
.scan-submit-bar button{width:100%; padding:15px; font-size:1rem; border-radius:14px; box-shadow:0 14px 26px -10px rgba(15,118,110,.55);}
.glow{box-shadow:0 0 0 6px rgba(234,179,8,.15), var(--shadow);}

/* confirm screen */
.confirm-wrap{text-align:center; background:#fff; border-radius:20px; padding:34px 26px; box-shadow:var(--shadow);}
.confirm-icon{
  width:74px; height:74px; border-radius:50%; margin:0 auto 16px; display:flex; align-items:center; justify-content:center;
  font-size:2rem; background:var(--success-bg); color:var(--success);
}
.confirm-wrap h2{font-size:1.25rem; font-weight:800; color:var(--navy); margin-bottom:6px;}
.confirm-nums{display:flex; justify-content:center; gap:14px; margin:18px 0;}
.confirm-nums .cn{padding:14px 20px; border-radius:14px; background:var(--bg1); min-width:100px;}
.confirm-nums .cn b{display:block; font-size:1.5rem; color:var(--navy);}
.confirm-nums .cn.absent b{color:var(--danger);}
.absent-names{text-align:right; background:var(--danger-bg); border-radius:12px; padding:14px 16px; margin-top:6px; max-height:200px; overflow:auto;}
.absent-names li{font-size:.85rem; padding:4px 0; color:#7a1f1f; font-weight:600; list-style:none;}

/* ---------- QR page ---------- */
.qr-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px;}
.qr-card{background:#fff; border-radius:18px; box-shadow:var(--shadow); padding:20px; text-align:center;}
.qr-card .qr-school{font-size:.72rem; color:#5b7382; font-weight:700;}
.qr-card .qr-class{font-size:1.05rem; font-weight:800; color:var(--navy); margin:4px 0 12px;}
.qr-card .qr-box{display:flex; justify-content:center; margin-bottom:12px;}
.qr-card .qr-hint{font-size:.72rem; color:var(--teal); font-weight:700; margin-bottom:12px;}
.qr-card .qr-actions{display:flex; gap:6px; justify-content:center;}

/* ---------- Guardians / Reports ---------- */
.guardian-phone{color:var(--teal)!important; font-weight:700; direction:ltr; unicode-bidi:plaintext;}
.report-table{width:100%; border-collapse:collapse; background:#fff; border-radius:14px; overflow:hidden; box-shadow:var(--shadow);}
.report-table th,.report-table td{padding:11px 12px; border-bottom:1px solid var(--line); text-align:right; font-size:.82rem;}
.report-table th{background:var(--navy); color:#fff; font-weight:800;}
.report-table tr:last-child td{border-bottom:none;}
.status-present{color:var(--success);font-weight:800}.status-absent{color:var(--danger);font-weight:800}.status-missing{color:#8299a6;font-weight:700}
.report-filters{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-bottom:18px}
@media(max-width:700px){.report-filters{grid-template-columns:1fr}.report-table{font-size:.78rem}.report-table th,.report-table td{padding:8px 7px}}
/* ---------- Toast ---------- */
.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--navy); color:#fff;
  padding:12px 22px; border-radius:12px; font-weight:700; font-size:.85rem; box-shadow:var(--shadow); opacity:0; transition:.25s; z-index:200;
  display:flex; align-items:center; gap:8px;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.toast.err{background:var(--danger);}


/* ---------- Responsive: mobile / iPad / desktop ---------- */
html,body{max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;}
button,input,select{font:inherit;}
.topbar{flex-wrap:wrap;gap:10px;}
.topnav{display:flex;flex-wrap:wrap;gap:6px;}
.classes-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));}
.stats-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));}
.cc-actions{grid-template-columns:repeat(2,minmax(0,1fr));}
.cc-actions button{min-height:44px;}
.container,.scan-wrap{width:min(1180px,calc(100% - 24px));}
input,select,.btn{min-height:42px;}
.notification-bell{position:relative;display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:0;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;font-size:1.2rem;}
.notification-bell .bell-count{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:99px;background:#dc2626;color:#fff;font-size:.65rem;display:flex;align-items:center;justify-content:center;font-weight:800;padding:0 4px;}
.notification-bell.ring{animation:bellRing .55s ease-in-out 3;}
@keyframes bellRing{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@media(max-width:900px){.topbar{padding:10px 12px}.brand-text h1{font-size:1rem}.brand-text p{font-size:.68rem}.clock{display:none}.topnav{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}.topnav .nav-btn{white-space:nowrap}.page-title{align-items:flex-start;gap:10px}.cc-actions{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.container,.scan-wrap{width:calc(100% - 16px)}.page-title{flex-direction:column}.page-title>div:last-child{width:100%}.page-title .btn{width:100%}.stats-grid{grid-template-columns:repeat(2,1fr);gap:8px}.stat-card{padding:12px 8px}.stat-card .num{font-size:1.35rem}.class-card{border-radius:14px}.cc-body{padding:12px}.cc-actions{gap:6px}.cc-actions button{font-size:.75rem;padding:9px 5px}.scan-wrap{padding-bottom:12px}.student-item{padding:10px 8px}.student-item .s-name{font-size:.88rem}.report-table{min-width:620px}.report-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}.report-filters{gap:8px}.confirm-wrap{padding:24px 14px}.toast{width:calc(100% - 24px);text-align:center;justify-content:center}.notification-bell{width:40px;height:40px}}
@media(min-width:601px) and (max-width:1024px){.container,.scan-wrap{width:calc(100% - 32px)}.classes-grid{grid-template-columns:repeat(2,minmax(0,1fr));}.cc-actions{grid-template-columns:repeat(3,1fr);}}

.empty{text-align:center; padding:50px 20px; color:#8299a6;}
.empty b{display:block; color:var(--navy); font-size:1rem; margin-bottom:6px;}

@media print{
  .topbar, .no-print{display:none !important;}
  body{background:#fff;}
}
</style>
</head>
<body>

<div class="topbar no-print">
  <div class="brand">
    <div class="brand-mark">ر</div>
    <div class="brand-text">
      <h1>منصة راصد لرصد الغياب</h1>
      <p>متوسطة آبي شعيب — مكة المكرمة</p>
    </div>
  </div>
  <div class="clock" id="clock">
    <div class="dates"><span id="clockHijri">—</span><span id="clockGregorian">—</span></div>
    <div class="time" id="clockTime">—</div>
  </div>
  <div class="topnav" id="topnav"></div>
</div>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="./firebase-config.js"></script>
<script>
/* ==========================================================================
   منصة راصد لرصد الغياب — تطبيق صفحة واحدة (SPA)

async function sha256Hex(s){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(s)));
  return Array.from(new Uint8Array(buf)).map(x=>x.toString(16).padStart(2,'0')).join('');
}

function studentUniqueKey(st){
  const cls=String(st.classId||'');
  const name=normalizeNameClient(st.name||'');
  return cls+'|'+(name || String(st.id||''));
}
function dedupeStudents(list){
  const seen=new Set(); const out=[];
  (list||[]).forEach(st=>{
    const key=studentUniqueKey(st);
    if(seen.has(key)) return;
    seen.add(key); out.push(st);
  });
  return out;
}
function studentsOfClass(classId){ return dedupeStudents(store.students.filter(s=>s.classId===classId)); }
function attendanceOf(classId, date){ return store.attendance.find(a=>a.classId===classId && a.date===(date||todayStr())); }
function classStats(cls){
  const total = studentsOfClass(cls.id).length;
  const att = attendanceOf(cls.id);
  const marked = att ? att.records.length : 0;
  const absent = att ? att.records.filter(r=>r.status==='غائب').length : 0;
  const present = marked - absent;
  const pct = total ? Math.round((present/total)*100) : 0;
  return { total, marked, absent, present, pct };
}
function visibleClasses(){
  if(!session) return [];
  if(session.type==='admin') return store.classes;
  return store.classes.filter(c=> (session.classes||[]).includes(c.id));
}

      document.getElementById('menu-'+btn.dataset.menu).classList.toggle('open');

  });
  document.addEventListener('click', ()=> document.querySelectorAll('.cc-menu-list').forEach(m=>m.classList.remove('open')), {once:true});

async function deleteClass(classId){
  const cls = store.classes.find(c=>c.id===classId);
  const count = studentsOfClass(classId).length;
  const msg = count>0
    ? `سيتم حذف فصل "${cls?cls.name:''}" مع جميع طالباته (${count}) وسجلات غيابه نهائياً. متابعة؟`
    : 'تأكيد حذف الفصل؟';
  if(!confirm(msg)) return;
  const pass = prompt('لتأكيد الحذف، يرجى إدخال كلمة مرور المشرفة:');
  if(pass===null) return; // ألغت العملية
  if(!(await verifyAdminPassword(pass))){ toast('كلمة المرور غير صحيحة — لم يتم حذف الفصل', true); return; }
  store.classes = store.classes.filter(c=>c.id!==classId);
  store.students = store.students.filter(s=>s.classId!==classId);
  store.attendance = store.attendance.filter(a=>a.classId!==classId);
  saveStore(); render();
  await pushToServer('deleteClass', {id:classId});
  toast('تم حذف الفصل وجميع طالباته');
}
async function deleteTodayAttendance(classId){
  if(!confirm('حذف رصد اليوم لهذا الفصل؟')) return;
  store.attendance = store.attendance.filter(a=>!(a.classId===classId && a.date===todayStr()));
  saveStore(); render();
  await pushToServer('deleteToday', {classId, date:todayStr()});
  toast('تم حذف رصد اليوم');
}

        <div style="display:flex; gap:10px; margin-bottom:12px;">
          <input class="searchbox" style="margin:0;" id="editSearchS" placeholder="بحث بالاسم أو الرقم...">
          <button class="btn btn-outline" id="editAddS" style="flex-shrink:0;">+ إضافة طالبة</button>
        </div>
        <div id="editStudentsList" style="max-height:280px; overflow:auto;"></div>
        ` : ''}

        <hr style="border:none; border-top:1px solid var(--line); margin:16px 0;">
        <p style="font-weight:800; color:var(--navy); margin-bottom:12px;">إضافة الطالبات إلى الفصل (اختاري إحدى الطرق أو استخدميها معاً):</p>

        <div class="field">
          <label style="color:#5b7382;">1) إضافة اسم اسم</label>
          <div style="display:flex; gap:8px;">
            <input id="singleStudentName" placeholder="اكتبي اسم الطالبة واضغطي إضافة">
            <button class="btn btn-outline" id="btnAddSingle" style="flex-shrink:0;">إضافة</button>
          </div>
        </div>

        <div class="field">
          <label style="color:#5b7382;">2) السحب والإسقاط (أي صيغة ملف)</label>
          <div class="dropzone" id="dz">
            <b>📥 اسحبي ملف الأسماء وأسقطيه هنا</b>
            أو اضغطي لاختيار ملف من جهازك
            <input type="file" id="fileInput" style="display:none">
          </div>
        </div>

        <div class="field">
          <label style="color:#5b7382;">3) لصق قائمة أسماء كاملة (اسم واحد في كل سطر)</label>
          <textarea id="bulkStudentsText" rows="3" style="width:100%; padding:11px 14px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg1); resize:vertical;" placeholder="ألصقي قائمة الأسماء هنا..."></textarea>
          <button class="btn btn-sm btn-outline" id="btnParseText" style="margin-top:8px;">حفظ الأسماء</button>
        </div>

        <div style="margin-top:16px;">
          <p style="font-weight:800; color:var(--navy); margin-bottom:8px;">قائمة الطالبات المضافة (<span id="studentCount">0</span>)</p>
          <div id="tempStudentList" style="max-height:220px; overflow:auto;"></div>

      </div>
    </div>
  </div>`;
  let tempStudents = [];
  const close = ()=> host.innerHTML='';
  document.getElementById('cl').onclick = close;
  document.getElementById('cancel').onclick = close;
  document.getElementById('ov').onclick = (e)=>{ if(e.target.id==='ov') close(); };

  if(existing){
    const drawEditStudents = (filter)=>{
      let list = studentsOfClass(existing.id).sort((a,b)=> (a.number||'').localeCompare(b.number||'', 'ar', {numeric:true}));
      if(filter) list = list.filter(s=> s.name.includes(filter) || String(s.number).includes(filter));
      document.getElementById('editStudentCount').textContent = studentsOfClass(existing.id).length;
      document.getElementById('editStudentsList').innerHTML = list.map(s=>`
        <div class="list-row">
          <div class="info"><b>${esc(s.name)}</b><span>رقم ${esc(s.number)}${guardianPhoneForStudent(s)?` — <span class="guardian-phone">ولي الأمر: ${esc(guardianPhoneForStudent(s))}</span>`:''}</span></div>
          <div class="row-actions">
            <button class="icon-btn" data-edit-student-inline="${s.id}">✎</button>
            <button class="icon-btn del" data-del-student-inline="${s.id}">🗑</button>
          </div>
        </div>`).join('') || `<div class="empty"><b>لا توجد طالبات مطابقة</b></div>`;
      document.querySelectorAll('[data-edit-student-inline]').forEach(b=> b.onclick = ()=> openStudentFormModal(existing.id, store.students.find(s=>s.id===b.dataset.editStudentInline), ()=> drawEditStudents(document.getElementById('editSearchS').value.trim())));
      document.querySelectorAll('[data-del-student-inline]').forEach(b=> b.onclick = async ()=>{
        if(!confirm('حذف هذه الطالبة؟')) return;
        store.students = store.students.filter(s=>s.id!==b.dataset.delStudentInline); saveStore();
        await pushToServer('deleteStudent', {id:b.dataset.delStudentInline});
        drawEditStudents(document.getElementById('editSearchS').value.trim());
        toast('تم حذف الطالبة');
      });
    };
    drawEditStudents();
    document.getElementById('editSearchS').oninput = (e)=> drawEditStudents(e.target.value.trim());
    document.getElementById('editAddS').onclick = ()=> openStudentFormModal(existing.id, null, ()=> drawEditStudents(document.getElementById('editSearchS').value.trim()));
  }

  if(!existing){
    const renderTemp = ()=>{
      document.getElementById('studentCount').textContent = tempStudents.length;
      document.getElementById('tempStudentList').innerHTML = tempStudents.map((name,i)=>`
        <div class="list-row" style="margin-bottom:6px; padding:9px 12px;">
          <div class="info"><b style="font-size:.88rem;">${esc(name)}</b></div>
          <button class="icon-btn del" data-rm="${i}">🗑</button>
        </div>`).join('') || `<p style="color:#8299a6; font-size:.85rem;">لم تتم إضافة أي طالبة بعد</p>`;
      document.querySelectorAll('[data-rm]').forEach(b=> b.onclick = ()=>{ tempStudents.splice(Number(b.dataset.rm),1); renderTemp(); });
    };
    const addNames = (names)=>{
      names.forEach(n=>{ if(n && !tempStudents.includes(n)) tempStudents.push(n); });
      renderTemp();
    };
    renderTemp();

    document.getElementById('btnAddSingle').onclick = ()=>{
      const inp = document.getElementById('singleStudentName');
      const val = inp.value.trim();
      if(val){ addNames([val]); inp.value=''; inp.focus(); }
    };
    document.getElementById('singleStudentName').addEventListener('keypress', e=>{
      if(e.key==='Enter'){ e.preventDefault(); document.getElementById('btnAddSingle').click(); }
    });
    document.getElementById('btnParseText').onclick = ()=>{
      const text = document.getElementById('bulkStudentsText').value;
      const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
      addNames(lines);
      document.getElementById('bulkStudentsText').value='';
    };

    const dz = document.getElementById('dz');
    dz.onclick = ()=> document.getElementById('fileInput').click();
    dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('drag'); });
    dz.addEventListener('dragleave', ()=> dz.classList.remove('drag'));
    dz.addEventListener('drop', e=>{
      e.preventDefault(); dz.classList.remove('drag');
      if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
    document.getElementById('fileInput').onchange = (e)=>{ if(e.target.files[0]) handleFile(e.target.files[0]); };

    function handleFile(file){
      const isExcel = /\.(xlsx|xls)$/i.test(file.name);
      const reader = new FileReader();
      reader.onload = (ev)=>{
        try{
          if(isExcel){
            const wb = XLSX.read(ev.target.result, {type:'binary'});
            const ws = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(ws, {header:1});
            const names = rows.filter(r=>r.length && r[0]!=='').map(r=> String(r.length>=2? r[1] : r[0]).trim()).filter(Boolean);
            addNames(names);
          }else{
            const text = ev.target.result;
            const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
            addNames(lines);
          }
          toast(`تم استيراد الأسماء من "${file.name}"`);
        }catch(err){ toast('تعذّرت قراءة الملف', true); }
      };
      if(isExcel) reader.readAsBinaryString(file); else reader.readAsText(file);
    }
  }

  document.getElementById('save').onclick = async ()=>{
    const number = document.getElementById('cNum').value.trim();
    const name = document.getElementById('cName').value.trim();
    if(!name){ toast('يرجى إدخال اسم الفصل', true); return; }

      toast('تم تحديث الفصل');
    }else{
      const classId = uid();
      const classObj = { id: classId, number: number || name, name };
      const newStudents = tempStudents.map((n,i)=>({ id: uid(), classId, number: String(i+1), name: n }));
      store.classes.push(classObj);
      store.students.push(...newStudents);
      saveStore();
      await pushToServer('saveClassWithStudents', { classObj, students: newStudents });
      toast('تم حفظ الفصل والطالبات بنجاح');
    }
    close(); render();
  };
}

function nextStudentNumber(classId, excludeId){
  const numbers = studentsOfClass(classId)
    .filter(s=>s.id!==excludeId)
    .map(s=>Number(String(s.number||'').trim()))
    .filter(n=>Number.isSafeInteger(n) && n>0);
  return String(Math.max(0, ...numbers)+1);
}

function openStudentFormModal(classId, existing, onDone){
  const host = document.getElementById('modalHost');
  const prevHTML = host.innerHTML;
  const classOptions = store.classes.map(c=>`<option value="${c.id}" ${existing&&existing.classId===c.id?'selected':(c.id===classId?'selected':'')}>${esc(c.name)}</option>`).join('');
  const wrap = document.createElement('div');
  wrap.innerHTML = `
  <div class="overlay" id="ov2" style="z-index:110;">
    <div class="modal">
      <div class="modal-head"><h3>${existing?'تعديل طالبة':'إضافة طالبة'}</h3><button class="modal-close" id="cl2">✕</button></div>
      <div class="modal-body">
        <div class="field"><label>الفصل</label><select id="sClass">${classOptions}</select></div>
        <div class="two-col">
          <div class="field"><label>رقم الطالبة</label><input id="sNum" value="${existing?esc(existing.number):esc(nextStudentNumber(classId))}" readonly><small style="display:block;color:#8299a6;font-size:.72rem;margin-top:4px;">يُحدد تلقائياً حسب ترتيب الفصل</small></div>
          <div class="field"><label>الاسم الكامل</label><input id="sName" value="${existing?esc(existing.name):''}"></div>
        </div>
        <div class="field"><label>رقم جوال ولي الأمر <span style="color:#8299a6;font-weight:500;">(اختياري)</span></label><input id="sGuardian" inputmode="tel" placeholder="05xxxxxxxx" value="${existing?esc(guardianPhoneForStudent(existing)):''}"></div>
      </div>
      <div class="modal-foot"><button class="btn btn-outline" id="cancel2">إلغاء</button><button class="btn btn-primary" id="save2">حفظ</button></div>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  const close = ()=> document.body.removeChild(wrap);
  wrap.querySelector('#cl2').onclick = close;
  wrap.querySelector('#cancel2').onclick = close;
  wrap.querySelector('#ov2').onclick = (e)=>{ if(e.target.id==='ov2') close(); };
  wrap.querySelector('#sClass').onchange = ()=>{
    const selectedClassId = wrap.querySelector('#sClass').value;
    if(!existing || selectedClassId!==existing.classId){
      wrap.querySelector('#sNum').value = nextStudentNumber(selectedClassId, existing&&existing.id);
    }else{
      wrap.querySelector('#sNum').value = existing.number;
    }
  };
  wrap.querySelector('#save2').onclick = async ()=>{
    const name = wrap.querySelector('#sName').value.trim();
    const clsId = wrap.querySelector('#sClass').value;
    const number = existing && clsId===existing.classId ? existing.number : nextStudentNumber(clsId, existing&&existing.id);
    const guardianPhone = wrap.querySelector('#sGuardian').value.trim();
    if(!name){ toast('أدخلي اسم الطالبة', true); return; }
    if(existing){
      const oldName = existing.name;
      const updated = Object.assign({}, existing, {name, number, classId:clsId, guardianPhone, oldName});
      const result = await pushToServer('saveStudent', updated);
      if(!result.ok) { toast('تعذر حفظ التعديل في Google Sheets — لم يتم اعتماده محلياً', true); return; }
      Object.assign(existing, updated); delete existing.oldName; saveStore();
      toast('تم تحديث بيانات الطالبة ورقم ولي الأمر ومزامنتها');
    }else{
      const st = { id: uid(), classId: clsId, number, name, guardianPhone };
      const result = await pushToServer('saveStudent', st);
      if(!result.ok) { toast('تعذر حفظ الطالبة في Google Sheets', true); return; }
      store.students.push(st); saveStore();
      toast('تمت إضافة الطالبة ورقم ولي الأمر ومزامنتهما');
    }
    close(); onDone && onDone(); renderTopnav();
  };
}

let scanAbsentSet = new Set();
function toggleStudentAbsent(id){
  const btn = document.querySelector(`[data-toggle="${id}"]`);
  if(!btn) return false;
  const item = btn.closest('.student-item');
  if(scanAbsentSet.has(id)){ scanAbsentSet.delete(id); btn.classList.remove('on'); item.classList.remove('absent'); }
  else{ scanAbsentSet.add(id); btn.classList.add('on'); item.classList.add('absent'); }
  return true;
}
function bindScan(){
  scanAbsentSet = new Set();
  const list = document.getElementById('studentsList');
  if(!list) { bindEditBtn(); return; }
  list.addEventListener('click', (e)=>{
    const btn = e.target.closest('[data-toggle]');
    if(!btn) return;
    toggleStudentAbsent(btn.dataset.toggle);
  });
  const barcodeInput = document.getElementById('barcodeInput');
  if(barcodeInput){
    barcodeInput.addEventListener('keypress', (e)=>{
      if(e.key !== 'Enter') return;
      e.preventDefault();
      const code = barcodeInput.value.trim();
      barcodeInput.value = '';
      if(!code) return;
      const students = studentsOfClass(route.classId);
      const match = students.find(s => String(s.number) === code || s.id === code);
      if(match){
        toggleStudentAbsent(match.id);
        toast(scanAbsentSet.has(match.id) ? `تم تحديد "${match.name}" غائبة` : `تم تحديد "${match.name}" حاضرة`);
      }else{
        toast('لم يتم العثور على طالبة بهذا الرقم', true);
      }
    });
  }
  const finishBtn = document.getElementById('finishScan');
  if(finishBtn) finishBtn.onclick = submitScan;
  const addNameBtn = document.getElementById('addTeacherNameBtn');
  if(addNameBtn) addNameBtn.onclick = addTeacherNameQuick;
  bindEditBtn();
}
async function addTeacherNameQuick(){
  const name = (prompt('اكتبي اسم المعلمة لإضافته إلى القائمة:')||'').trim();
  if(!name) return;
  if(!store.teacherNames) store.teacherNames = [];
  if(!store.teacherNames.includes(name)){
    store.teacherNames.push(name);
    saveStore();
    // اسم محلي للقائمة السريعة فقط؛ code.gs الحالي لا يحتاج تخزينه على الخادم.
  }
  // نحدّث القائمة المنسدلة وحقل الإدخال مباشرة دون إعادة رسم الصفحة
  // حتى لا تُفقد حالة الطالبات المحددات كغائبات أثناء الرصد.
  const list = document.getElementById('teacherNamesList');
  if(list && !Array.from(list.options).some(o=>o.value===name)){
    const opt = document.createElement('option'); opt.value = name; list.appendChild(opt);
  }
  const input = document.getElementById('teacherSelect');
  if(input) input.value = name;
  toast(`تمت إضافة "${name}" إلى قائمة المعلمات`);
}
function bindEditBtn(){
  const editBtn = document.getElementById('editScanBtn');
  if(editBtn) editBtn.onclick = ()=>{ route.editing = true; render(); };
}
async function submitScan(){
  const classId = route.classId;
  const teacherSel = document.getElementById('teacherSelect');
  const teacher = (teacherSel ? teacherSel.value.trim() : '') || 'غير محدد';
  const students = studentsOfClass(classId);
  const records = students.map(s=>({ studentId:s.id, studentName:s.name, status: scanAbsentSet.has(s.id)?'غائب':'حاضر' }));
  const session_ = { id: classId+'|'+todayStr(), classId, date: todayStr(), teacher, time: nowTimeStr(), records };
  store.attendance = store.attendance.filter(a=>!(a.classId===classId && a.date===todayStr()));
  store.attendance.push(session_);
  saveStore();
  const saveResult = await pushToServer('saveAttendance', session_);
  const absentCount = records.filter(r=>r.status==='غائب').length;
  playAttendanceBell(absentCount);
  if(saveResult.ok) toast('تم حفظ الرصد ومزامنته مع Google Sheets');
  else { console.warn('saveAttendance failed:', saveResult); toast('تعذر تأكيد مزامنة الرصد مع Google Sheets — لم يُعتبر محفوظاً على الخادم', true); }
  speakThanks(teacher, absentCount);
  route.editing = false;
  render();
}
function speakThanks(teacher, absentCount){
  try{
    const greeting = (teacher && teacher!=='غير محدد') ? `شكراً لك ${teacher}، ` : 'شكراً لك، ';
    const msg = absentCount>0
      ? `${greeting}تم رصد الغياب بنجاح. عدد الغائبات ${absentCount}.`
      : `${greeting}تم رصد الحضور. جميع الطالبات حاضرات.`;
    const utter = new SpeechSynthesisUtterance(msg);
    utter.lang = 'ar-SA';
    speechSynthesis.cancel();
    speechSynthesis.speak(utter);
  }catch(e){}
}

function classScanUrl(classId){

  return url.toString();

function statusRank(s){ s=String(s||''); if(s==='غائبة'||s==='غائب'||s==='absent') return 0; if(s==='حاضرة'||s==='حاضر'||s==='present') return 1; return 2; }
// الغائبات أولاً ثم الحاضرات ثم غير المرصودات (مع الحفاظ على الترتيب الأصلي داخل كل مجموعة)
function sortAbsentFirst(rows, getStatus){ getStatus=getStatus||(r=>r.status); return rows.map((r,i)=>[r,i]).sort((a,b)=>statusRank(getStatus(a[0]))-statusRank(getStatus(b[0]))||a[1]-b[1]).map(x=>x[0]); }
function printElement(html, title){
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>${esc(title)}</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">

    .qr-card{border:2px solid #102a43; border-radius:14px; padding:18px; text-align:center; page-break-inside:avoid;}
    .qr-school{font-size:11px; color:#555;}
    .qr-class{font-size:18px; font-weight:800; color:#102a43; margin:6px 0 12px;}
    .qr-box{display:flex; justify-content:center; margin-bottom:10px;}
    .qr-hint{font-size:11px; color:#0f766e; font-weight:700;}
    .qr-actions{display:none;}
  </style></head><body>${html}</body></html>`);
  w.document.close();
  setTimeout(()=>{ w.focus(); w.print(); }, 400);
}

function openGuardianModal(existing){

function openGuardianImportModal(){

  host.innerHTML=`<div class="overlay" id="iov"><div class="modal wide"><div class="modal-head"><h3>استيراد أرقام أولياء الأمور</h3><button class="modal-close" id="icl">✕</button></div><div class="modal-body">

  let rows=[]; const close=()=>host.innerHTML=''; document.getElementById('icl').onclick=close; document.getElementById('icancel').onclick=close; document.getElementById('iov').onclick=e=>{if(e.target.id==='iov')close()};
  const dz=document.getElementById('gdz'), file=document.getElementById('gfile'); dz.onclick=()=>file.click();
  const read=f=>{const rd=new FileReader(); const excel=/\.(xlsx|xls)$/i.test(f.name); rd.onload=e=>{try{
    if(excel){
      const wb=XLSX.read(e.target.result,{type:'binary'}), ws=wb.Sheets[wb.SheetNames[0]], data=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      const headers=(data[0]||[]).map(x=>String(x).trim());
      let ni=headers.findIndex(h=>h.includes('اسم الطالبة')||h==='الطالبة'||h.includes('اسم'));

      if(ni<0) ni=0; if(pi<0) pi=1;
      rows=data.slice(1).map(r=>({name:String(r[ni]??'').trim(),phone:normalizePhoneClient(r[pi])})).filter(x=>x.name&&x.phone);
    }else{
      rows=String(e.target.result).split(/\r?\n/).slice(1).map(l=>l.split(/[,;\t]/)).map(r=>({name:String(r[0]||'').trim(),phone:normalizePhoneClient(r[1])})).filter(x=>x.name&&x.phone);

  }catch(err){toast('تعذر قراءة الملف',true)}}; excel?rd.readAsBinaryString(f):rd.readAsText(f)};
  file.onchange=e=>{if(e.target.files[0])read(e.target.files[0])}; dz.ondragover=e=>{e.preventDefault();dz.classList.add('drag')}; dz.ondragleave=()=>dz.classList.remove('drag'); dz.ondrop=e=>{e.preventDefault();dz.classList.remove('drag');if(e.dataTransfer.files[0])read(e.dataTransfer.files[0])};
  document.getElementById('gimportSave').onclick=async()=>{

function whatsappLink(phone, name, date){
  const num = normalizePhoneClient(phone);

function reportPeriodBounds(period, date){
  const [y,m,d]=date.split('-').map(Number); const selected=new Date(y,m-1,d);
  if(period==='monthly') return {start:`${y}-${String(m).padStart(2,'0')}-01`,end:`${y}-${String(m).padStart(2,'0')}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`};
  if(period==='weekly'){
    const day=selected.getDay(); const from=new Date(y,m-1,d-day); const to=new Date(from); to.setDate(from.getDate()+6);
    const fmt=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
    return {start:fmt(from),end:fmt(to)};
  }
  return {start:date,end:date};
}
function reportStatus(att, student){
  const rec=att?.records?.find(r=>String(r.studentId)===String(student.id)||normalizeNameClient(r.studentName||'')===normalizeNameClient(student.name));
  if(!rec)return 'لم يُرصد';
  return (rec.status==='غائب'||rec.status==='absent')?'غائبة':(rec.status==='حاضر'||rec.status==='present')?'حاضرة':String(rec.status||'لم يُرصد');

  document.getElementById('save').onclick = async ()=>{
    const name = document.getElementById('stName').value.trim();
    const role = document.getElementById('stRole').value.trim();
    const username = document.getElementById('stUser').value.trim();
    const password = document.getElementById('stPass').value.trim();
    if(!name || !username || (!password && !existing)){ toast('يرجى تعبئة جميع الحقول', true); return; }
    if(existing){
      const upd = {name, role, username, classes:[...selected]};
      if(password) upd.password = password;
      Object.assign(existing, upd);
      saveStore(); await pushToServer('saveStaff', Object.assign({}, existing, {password: password || existing.password || ''}));
      toast('تم تحديث بيانات الإدارية');
    }else{
      const st = { id: uid(), name, role, username, password, classes:[...selected] };
      store.staff.push(st); saveStore();
      await pushToServer('saveStaff', st);
      toast('تمت إضافة الإدارية');
    }
    close(); render();
  };
}

/* ==========================================================================
   التصدير: Excel و PDF
   ========================================================================== */
function exportClassExcel(classId){
  const cls = store.classes.find(c=>c.id===classId);
  const students = studentsOfClass(classId).sort((a,b)=> (a.number||'').localeCompare(b.number||'', 'ar', {numeric:true}));
  const att = attendanceOf(classId);
  const rows = sortAbsentFirst(students, s=>{ const rec = att ? att.records.find(r=>r.studentId===s.id) : null; return rec ? rec.status : 'لم يُرصد'; }).map(s=>{
    const rec = att ? att.records.find(r=>r.studentId===s.id) : null;
    return {
      'رقم الطالبة': s.number,
      'اسم الطالبة': s.name,
      'رقم ولي الأمر': guardianPhoneForStudent(s),
      'الحالة': rec ? rec.status : 'لم يُرصد',
      'المعلمة': att ? att.teacher : '',
      'وقت الرصد': att ? att.time : '',
      'التاريخ': todayStr()
    };
  });
  const ws = XLSX.utils.aoa_to_sheet([[SCHOOL_NAME],['تقرير الغياب اليومي — '+cls.name],['التاريخ: '+todayStr()],[],['رقم الطالبة','اسم الطالبة','رقم ولي الأمر','الحالة','المعلمة','وقت الرصد','التاريخ'],...rows.map(r=>[r['رقم الطالبة'],r['اسم الطالبة'],r['رقم ولي الأمر'],r['الحالة'],r['المعلمة'],r['وقت الرصد'],r['التاريخ']])]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'الغياب');
  XLSX.writeFile(wb, `تقرير_غياب_${cls.name}_${todayStr()}.xlsx`);
}
function exportClassPDF(classId){
  const cls = store.classes.find(c=>c.id===classId);
  const students = studentsOfClass(classId).sort((a,b)=> (a.number||'').localeCompare(b.number||'', 'ar', {numeric:true}));
  const att = attendanceOf(classId);
  const statusOf = s=>{ const rec = att ? att.records.find(r=>r.studentId===s.id) : null; return rec ? rec.status : 'لم يُرصد'; };
  const sortedStudents = sortAbsentFirst(students, statusOf);
  const rowsHtml = sortedStudents.map(s=>{
    const status = statusOf(s);
    const color = statusRank(status)===0 ? '#dc2626' : (statusRank(status)===1 ? '#16a34a' : '#8299a6');
    const guardianPhone = guardianPhoneForStudent(s);
    return `<tr><td>${esc(s.number)}</td><td>${esc(s.name)}</td><td>${guardianPhone?`<span class="guardian-phone">${esc(guardianPhone)}</span>`:'—'}</td><td style="color:${color}; font-weight:700;">${esc(status)}</td></tr>`;
  }).join('');
  const html = `
  <div style="font-family:'Cairo',sans-serif; direction:rtl; padding:10px;">
    <header style="display:flex;align-items:center;gap:18px;border-bottom:2px solid #0f766e;padding-bottom:14px;margin-bottom:16px;"><img src="${SCHOOL_LOGO_DATA}" alt="شعار المدرسة" style="width:90px;height:72px;object-fit:contain;"><div><h1 style="font-size:22px;color:#102a43;margin:0;">${esc(SCHOOL_NAME)}</h1><h2 style="color:#102a43;margin:5px 0;">تقرير غياب — ${esc(cls.name)}</h2></div></header>
    <p style="color:#555; font-size:13px;">${esc(SCHOOL_NAME)} — التاريخ: ${todayStr()} ${att? '— المعلمة: '+esc(att.teacher)+' — الساعة: '+esc(att.time):''}</p>
    <table style="width:100%; border-collapse:collapse; margin-top:14px;" border="1" cellpadding="8">
      <thead style="background:#102a43; color:#fff;"><tr><th>رقم الطالبة</th><th>اسم الطالبة</th><th>رقم ولي الأمر</th><th>الحالة</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
  </div>`;
  printElement(html, `تقرير غياب ${cls.name}`);
}

function init(){
  const params = new URLSearchParams(window.location.search);
  const cid = params.get('class');
  if(cid){
    route = { name:'scanDeep', classId:cid };
    pullFromServer(false).finally(render);
  }else{
    if(session) startAutoSync();
    render();
  }
}
window.navigate = navigate;
init();
