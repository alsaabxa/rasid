<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#102a43">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/rasid-icon-192.png">
<title>منصة راصد للغياب</title>
<script>
let rasidInstallPrompt=null;
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();rasidInstallPrompt=event;document.documentElement.classList.add('pwa-install-available');document.querySelectorAll('.pwa-install-btn').forEach(button=>button.hidden=false);});
window.addEventListener('appinstalled',()=>{rasidInstallPrompt=null;document.documentElement.classList.remove('pwa-install-available');});
async function installRasidApp(){if(!rasidInstallPrompt)return;rasidInstallPrompt.prompt();await rasidInstallPrompt.userChoice;rasidInstallPrompt=null;document.documentElement.classList.remove('pwa-install-available');}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{
  --navy:#102a43;
  --teal:#0f766e;
  --gold:#eab308;
  --bg1:#f6fafc;
  --bg2:#edf7f5;
  --text:#183247;
  --white:#ffffff;
  --danger:#dc2626;
  --danger-bg:#fef2f2;
  --success:#16a34a;
  --success-bg:#f0fdf4;
  --line:#dbe6ec;
  --radius:16px;
  --shadow:0 8px 24px -8px rgba(16,42,67,.18);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Cairo',sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--text);
  min-height:100vh;
  direction:rtl;
}
button, input, select{font-family:inherit; font-size:1rem;}
button{cursor:pointer; border:none; background:none; touch-action:manipulation;}
a{color:inherit; text-decoration:none;}
::selection{background:var(--gold); color:var(--navy);}

/* ---------- Header ---------- */
.topbar{
  background:var(--navy);
  color:#fff;
  padding:14px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  position:sticky; top:0; z-index:40;
  box-shadow:0 4px 18px -6px rgba(0,0,0,.35);
}
.brand{display:flex; align-items:center; gap:12px;}
.brand-mark{
  width:44px; height:44px; border-radius:12px;
  background:linear-gradient(135deg,var(--teal),var(--navy));
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:1.3rem; color:var(--gold);
  border:2px solid rgba(234,179,8,.5);
}
.brand-text h1{font-size:1.05rem; font-weight:800; letter-spacing:.2px;}
.brand-text p{font-size:.82rem; color:#fff1b8; font-weight:800; letter-spacing:.15px;}
.clock{
  display:flex; align-items:center; gap:10px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.10);
  padding:5px 10px; border-radius:10px;
  font-size:.76rem;
}
.clock .time{font-size:.98rem; font-weight:700; color:var(--gold); font-variant-numeric:tabular-nums; white-space:nowrap;}
.clock .dates{display:flex; flex-direction:column; gap:1px; color:#dce9ee; line-height:1.2;}
.topnav{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.menu-toggle{display:none;align-items:center;justify-content:center;width:42px;height:42px;border:1px solid rgba(255,255,255,.18);border-radius:11px;color:#fff;background:rgba(255,255,255,.08)}
.menu-toggle svg{width:23px;height:23px}
.menu-toggle:hover,.menu-toggle[aria-expanded="true"]{background:var(--teal);border-color:rgba(255,255,255,.35)}
.nav-btn{
  color:#e7eff3; padding:8px 14px; border-radius:10px; font-weight:600; font-size:.9rem;
  transition:background .15s;
}
.nav-btn:hover{background:rgba(255,255,255,.1);}
.nav-btn.active{background:var(--teal); color:#fff;}
.user-chip{
  display:flex; align-items:center; gap:10px;
  background:rgba(255,255,255,.08); padding:6px 12px; border-radius:999px;
  font-size:.85rem;
}
.user-chip .dot{width:8px; height:8px; border-radius:50%; background:var(--gold);}
.logout-btn{color:#f2b8b8; font-weight:700; font-size:.85rem;}

/* ---------- Layout ---------- */
.container{max-width:1240px; margin:0 auto; padding:26px 20px 60px;}
.page-title{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;}
.page-title h2{font-size:1.4rem; font-weight:800; color:var(--navy);}
.page-title p{color:#5b7382; font-size:.9rem;}

/* ---------- Stat cards ---------- */
.stats-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:28px;}
@media(max-width:800px){.stats-grid{grid-template-columns:repeat(2,1fr);}}
.stat-card{
  background:#fff; border-radius:var(--radius); padding:18px 20px;
  box-shadow:var(--shadow); border-top:4px solid var(--teal);
  display:flex; flex-direction:column; gap:6px;
}
.stat-card.gold{border-top-color:var(--gold);}
.stat-card.danger{border-top-color:var(--danger);}
.stat-card.navy{border-top-color:var(--navy);}
.stat-card .num{font-size:1.9rem; font-weight:800; color:var(--navy);}
.stat-card .lbl{color:#5b7382; font-size:.85rem; font-weight:600;}

/* ---------- Class cards ---------- */
.classes-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:18px;}
.class-card{
  background:#fff; border-radius:var(--radius); box-shadow:var(--shadow);
  overflow:hidden; display:flex; flex-direction:column;
}
.class-card .cc-top{height:6px; background:linear-gradient(90deg,var(--teal),var(--navy));}
.class-card .cc-body{padding:18px; display:flex; flex-direction:column; gap:12px;}
.cc-head{display:flex; align-items:center; justify-content:space-between;}
.cc-head h3{font-size:1.05rem; font-weight:800; color:var(--navy);}
.cc-menu{position:relative;}
.cc-menu-btn{color:#8299a6; font-size:1.2rem; padding:2px 8px; border-radius:6px;}
.cc-menu-btn:hover{background:#eef3f5;}
.cc-menu-list{
  position:absolute; left:0; top:28px; background:#fff; border-radius:10px;
  box-shadow:var(--shadow); border:1px solid var(--line); min-width:140px; z-index:10; display:none; overflow:hidden;
}
.cc-menu-list.open{display:block;}
.cc-menu-list button{display:block; width:100%; text-align:right; padding:10px 14px; font-size:.85rem; font-weight:600;}
.cc-menu-list button:hover{background:#f4f8f9;}
.progress-wrap{background:#eef3f5; border-radius:999px; height:9px; overflow:hidden;}
.progress-bar{height:100%; background:linear-gradient(90deg,var(--teal),var(--success)); border-radius:999px; transition:width .4s;}
.cc-nums{display:flex; justify-content:space-between; font-size:.78rem; color:#5b7382; font-weight:600;}
.cc-nums b{color:var(--navy);}
.cc-actions{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}
.cc-actions button{
  background:var(--bg1); border:1px solid var(--line); border-radius:9px; padding:8px 4px;
  font-size:.72rem; font-weight:700; color:var(--navy); display:flex; flex-direction:column; align-items:center; gap:2px;
}
.cc-actions button:hover{background:#e4f1ee; border-color:var(--teal);}
.cc-actions button.primary{background:var(--teal); color:#fff; border-color:var(--teal);}
.cc-actions button.primary:hover{background:#0c5f58;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:10px 18px; border-radius:10px;
  font-weight:700; font-size:.9rem; transition:transform .1s, box-shadow .15s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--teal); color:#fff; box-shadow:0 6px 16px -6px rgba(15,118,110,.5);}
.btn-primary:hover{background:#0c5f58;}
.btn-gold{background:var(--gold); color:var(--navy); box-shadow:0 6px 16px -6px rgba(234,179,8,.5);}
.btn-gold:hover{background:#c99a06;}
.btn-outline{background:#fff; color:var(--navy); border:1.5px solid var(--line);}
.btn-outline:hover{border-color:var(--teal); color:var(--teal);}
.btn-danger{background:var(--danger-bg); color:var(--danger); border:1.5px solid #fecaca;}
.btn-danger:hover{background:#fee2e2;}
.btn-sm{padding:7px 12px; font-size:.8rem;}
.btn[disabled]{opacity:.5; cursor:not-allowed;}

/* ---------- Login ---------- */
.login-wrap{min-height:calc(100vh - 76px); display:flex; align-items:center; justify-content:center; padding:20px;}
.login-card{
  background:#fff; border-radius:22px; box-shadow:var(--shadow); width:100%; max-width:400px;
  padding:36px 32px; text-align:center;
}
.login-card .brand-mark{margin:0 auto 14px; width:60px; height:60px; font-size:1.7rem;}
.login-card h2{color:var(--navy); font-size:1.3rem; font-weight:800; margin-bottom:4px;}
.login-card p.sub{color:#5b7382; font-size:.85rem; margin-bottom:26px;}
.field{text-align:right; margin-bottom:14px;}
.field label{display:block; font-size:.8rem; font-weight:700; color:var(--navy); margin-bottom:6px;}
.field input, .field select{
  width:100%; padding:11px 14px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg1);
  outline:none; transition:border .15s;
}
.field input:focus, .field select:focus{border-color:var(--teal); background:#fff;}
.login-tabs{display:flex; gap:8px; margin-bottom:20px; background:var(--bg1); padding:4px; border-radius:12px;}
.login-tabs button{flex:1; padding:9px; border-radius:9px; font-weight:700; font-size:.85rem; color:#5b7382;}
.login-tabs button.active{background:#fff; color:var(--navy); box-shadow:0 2px 8px rgba(0,0,0,.08);}
.login-error{color:var(--danger); font-size:.82rem; font-weight:600; margin-bottom:10px; min-height:1em;}

/* ---------- Modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(16,42,67,.55); display:flex; align-items:center; justify-content:center;
  z-index:100; padding:16px; backdrop-filter:blur(2px);
}
.modal{
  background:#fff; border-radius:20px; width:100%; max-width:560px; max-height:90vh; overflow:auto;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.4);
}
.modal.wide{max-width:820px;}
.modal-head{
  padding:20px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; background:#fff; z-index:2;
}
.modal-head h3{font-size:1.1rem; font-weight:800; color:var(--navy);}
.modal-close{font-size:1.3rem; color:#8299a6; padding:4px 10px; border-radius:8px;}
.modal-close:hover{background:#f2f5f6;}
.modal-body{padding:22px 24px;}
.modal-foot{padding:16px 24px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:520px){.two-col{grid-template-columns:1fr;}}

/* ---------- Tables / lists ---------- */
.list-row{
  display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-radius:10px;
  border:1px solid var(--line); margin-bottom:8px;
}
.list-row .info b{display:block; color:var(--navy); font-size:.92rem;}
.list-row .info span{color:#5b7382; font-size:.78rem;}
.row-actions{display:flex; gap:6px;}
.icon-btn{width:44px; min-width:44px; height:44px; min-height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; color:#5b7382; background:var(--bg1); touch-action:manipulation;}
.icon-btn:hover{background:#e4f1ee; color:var(--teal);}
.icon-btn.del:hover{background:var(--danger-bg); color:var(--danger);}
.searchbox{
  width:100%; padding:11px 14px; border-radius:10px; border:1.5px solid var(--line); margin-bottom:14px; background:var(--bg1);
}
.chip-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.chip{
  padding:5px 10px; border-radius:999px; border:1.5px solid var(--line); font-size:.75rem; font-weight:700; color:#5b7382; cursor:pointer;
}
.chip.selected{background:var(--teal); color:#fff; border-color:var(--teal);}

/* ---------- Dropzone ---------- */
.dropzone{
  border:2px dashed var(--line); border-radius:14px; padding:26px; text-align:center; color:#5b7382; font-size:.85rem;
  transition:border-color .15s, background .15s; margin-top:14px; cursor:pointer;
}
.dropzone.drag{border-color:var(--teal); background:#f0faf8;}
.dropzone b{color:var(--teal); display:block; margin-bottom:4px; font-size:.95rem;}

/* ---------- Scan page ---------- */
.scan-wrap{max-width:640px; margin:0 auto; padding:26px 18px 60px;}
.scan-head{
  background:linear-gradient(135deg,var(--navy),#183f5f); color:#fff; border-radius:20px; padding:26px 24px; margin-bottom:20px;
  text-align:center; box-shadow:0 14px 30px -14px rgba(16,42,67,.5); position:relative; overflow:hidden;
}
.scan-head::after{
  content:''; position:absolute; inset:0; background:radial-gradient(circle at 30% -10%, rgba(234,179,8,.25), transparent 60%);
  pointer-events:none;
}
.scan-head h2{font-size:1.3rem; font-weight:800; position:relative;}
.scan-head p{font-size:.85rem; color:#cfe0e8; margin-top:4px; position:relative;}
.teacher-field{margin-top:16px; position:relative;}
.teacher-field input, .teacher-field select{
  width:100%; padding:11px 14px; border-radius:10px; border:none; text-align:center; font-weight:700; color:var(--navy);
}
.student-item{
  display:flex; align-items:center; justify-content:space-between; background:#fff; border-radius:14px; padding:14px 16px;
  margin-bottom:10px; box-shadow:0 3px 10px -4px rgba(16,42,67,.12); border:2px solid transparent; transition:.15s;
}
.student-item.absent{border-color:var(--danger); background:var(--danger-bg);}
.student-item .s-info{display:flex; align-items:center; gap:12px;}
.student-item .s-num{
  width:34px; height:34px; border-radius:9px; background:var(--bg1); display:flex; align-items:center; justify-content:center;
  font-weight:800; color:var(--navy); font-size:.85rem;
}
.student-item.absent .s-num{background:var(--danger); color:#fff;}
.student-item .s-name{font-weight:700; color:var(--navy);}
.absent-toggle{
  width:56px; height:30px; border-radius:999px; background:#e2ecef; position:relative; transition:.2s; flex-shrink:0;
}
.absent-toggle::after{
  content:'حاضرة'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:.62rem; font-weight:800; color:#5b7382;
}
.absent-toggle.on{background:var(--danger);}
.absent-toggle.on::after{content:'غائبة'; color:#fff;}
body.school-boys .absent-toggle::after{content:'حاضر';}
body.school-boys .absent-toggle.on::after{content:'غائب';}
.scan-submit-bar{position:sticky; bottom:14px; margin-top:18px;}
.scan-submit-bar button{width:100%; padding:15px; font-size:1rem; border-radius:14px; box-shadow:0 14px 26px -10px rgba(15,118,110,.55);}
.glow{box-shadow:0 0 0 6px rgba(234,179,8,.15), var(--shadow);}

/* confirm screen */
.confirm-wrap{text-align:center; background:#fff; border-radius:20px; padding:34px 26px; box-shadow:var(--shadow);}
.confirm-icon{
  width:74px; height:74px; border-radius:50%; margin:0 auto 16px; display:flex; align-items:center; justify-content:center;
  font-size:2rem; background:var(--success-bg); color:var(--success);
}
.confirm-wrap h2{font-size:1.25rem; font-weight:800; color:var(--navy); margin-bottom:6px;}
.confirm-nums{display:flex; justify-content:center; gap:14px; margin:18px 0;}
.confirm-nums .cn{padding:14px 20px; border-radius:14px; background:var(--bg1); min-width:100px;}
.confirm-nums .cn b{display:block; font-size:1.5rem; color:var(--navy);}
.confirm-nums .cn.absent b{color:var(--danger);}
.absent-names{text-align:right; background:var(--danger-bg); border-radius:12px; padding:14px 16px; margin-top:6px; max-height:200px; overflow:auto;}
.absent-names li{font-size:.85rem; padding:4px 0; color:#7a1f1f; font-weight:600; list-style:none;}

/* ---------- QR page ---------- */
.qr-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px;}
.qr-card{background:#fff; border-radius:18px; box-shadow:var(--shadow); padding:20px; text-align:center;}
.qr-card .qr-school{font-size:.72rem; color:#5b7382; font-weight:700;}
.qr-card .qr-class{font-size:1.05rem; font-weight:800; color:var(--navy); margin:4px 0 8px;}
.qr-card .qr-brand{display:flex; align-items:center; justify-content:center; gap:8px; margin:0 0 12px; color:var(--navy); font-size:.82rem; font-weight:800;}
.qr-card .qr-brand-mark{display:inline-flex; width:24px; height:24px; align-items:center; justify-content:center; border-radius:8px; background:var(--teal); color:#fff; font-size:1rem; font-weight:900;}
.qr-card .qr-box{display:flex; justify-content:center; margin-bottom:12px;}
.qr-card .qr-hint{font-size:.72rem; color:var(--teal); font-weight:700; margin-bottom:12px;}
.qr-card .qr-actions{display:flex; gap:6px; justify-content:center;}

/* ---------- Guardians / Reports ---------- */
.guardian-phone{color:var(--teal)!important; font-weight:700; direction:ltr; unicode-bidi:plaintext;}
.report-table{width:100%; border-collapse:collapse; background:#fff; border-radius:14px; overflow:hidden; box-shadow:var(--shadow);}
.report-table th,.report-table td{padding:11px 12px; border-bottom:1px solid var(--line); text-align:right; font-size:.82rem;}
.report-table th{background:var(--navy); color:#fff; font-weight:800;}
.report-table tr:last-child td{border-bottom:none;}
.status-present{color:var(--success);font-weight:800}.status-absent{color:var(--danger);font-weight:800}.status-missing{color:#8299a6;font-weight:700}
.report-filters{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-bottom:18px}
@media(max-width:700px){.report-filters{grid-template-columns:1fr}.report-table{font-size:.78rem}.report-table th,.report-table td{padding:8px 7px}}
/* ---------- Toast ---------- */
.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--navy); color:#fff;
  padding:12px 22px; border-radius:12px; font-weight:700; font-size:.85rem; box-shadow:var(--shadow); opacity:0; transition:.25s; z-index:200;
  display:flex; align-items:center; gap:8px;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.toast.err{background:var(--danger);}


/* ---------- Responsive: mobile / iPad / desktop ---------- */
html,body{max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;}
button,input,select{font:inherit;}
.topbar{flex-wrap:wrap;gap:10px;}
.topnav{display:flex;flex-wrap:wrap;gap:6px;}
.classes-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));}
.stats-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));}
.cc-actions{grid-template-columns:repeat(2,minmax(0,1fr));}
.cc-actions button{min-height:44px;}
.container,.scan-wrap{width:min(1180px,calc(100% - 24px));}
input,select,.btn{min-height:44px; touch-action:manipulation;}
.notification-bell{position:relative;display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:0;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;font-size:1.2rem;}
.notification-bell .bell-count{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:99px;background:#dc2626;color:#fff;font-size:.65rem;display:flex;align-items:center;justify-content:center;font-weight:800;padding:0 4px;}
.message-nav{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;width:42px;height:42px;padding:0!important;border:0;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;transition:background .15s}
.message-nav:hover,.message-nav.active{background:var(--teal);color:#fff}
.message-nav svg{width:21px;height:21px}.message-nav .message-count{position:absolute;top:-4px;right:-4px;display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:#dc2626;color:#fff;font-size:.62rem;font-weight:800}.message-nav-label{display:none}
.refresh-icon-wrap{display:inline-flex;align-items:center;justify-content:center;width:1.15em;height:1.15em;font-size:1.2em;line-height:1;vertical-align:middle}
.sync-indicator{display:inline-block;width:11px;height:11px;flex:0 0 11px;border:1.5px solid #fff;border-radius:50%;background:#dc2626;box-shadow:0 0 0 1px rgba(16,42,67,.18);vertical-align:middle}
.refresh-status-button{min-width:92px;justify-content:center;gap:8px}
.sync-indicator[data-state="synced"]{background:#16a34a;box-shadow:0 0 0 1px rgba(22,163,74,.28)}

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script src="./firebase-config.js"></script>
<script>
/* ==========================================================================
   منصة راصد للغياب — تطبيق صفحة واحدة (SPA)
   مصدر البيانات السحابي: Firebase Authentication + Cloud Firestore.
   يحتفظ التطبيق بنسخة محلية مؤقتة لدعم الاستمرارية عند ضعف الاتصال.
   ========================================================================== */
let SCHOOL_NAME = "منصة راصد للمدارس";
const firebaseConfig = window.RASID_FIREBASE_CONFIG || {};
let auth = null, db = null, activeSchoolId = null, firebaseReady = false, saveTimer = null, pendingRegistration = false;
try {
  if (firebaseConfig.apiKey && firebaseConfig.projectId) {
    firebase.initializeApp(firebaseConfig); auth = firebase.auth(); db = firebase.firestore(); firebaseReady = true;
  }
} catch (e) { console.error('Firebase initialization failed', e); }
const SCHOOL_LOGO_DATA = 'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#102a43"/><text x="50" y="68" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="58" fill="#eab308">ر</text></svg>');
const MINISTRY_LOGO_URL = new URL('./assets/ministry-education.svg',location.href).href;
let STORAGE_KEY = "rasid_store_v1";
const SESSION_KEY = "rasid_session_v1";

/* ---------- state ---------- */
let store = loadStore();
let session = loadSession();
// Do not render a cached, unscoped store as an authenticated school's data.
let schoolDataReady = !auth;
let route = { name: session ? "dashboard" : "login" };
let dashboardQuery = '';
let pendingClassForScan = null; // used for ?class= deep link

function loadStore(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(!Array.isArray(parsed.teacherNames)) parsed.teacherNames = [];
      if(!Array.isArray(parsed.guardians)) parsed.guardians = [];
      if(!Array.isArray(parsed.whatsappContacts)) parsed.whatsappContacts = [];
      if(!parsed.reportSignatures || typeof parsed.reportSignatures !== 'object') parsed.reportSignatures = {manager:'', attendance:''};
      if(typeof parsed.reportSignatures.manager !== 'string') parsed.reportSignatures.manager = '';
      if(typeof parsed.reportSignatures.attendance !== 'string') parsed.reportSignatures.attendance = '';
      if(!['boys','girls'].includes(parsed.schoolType)) parsed.schoolType = 'girls';
      return parsed;
    }
  }catch(e){}
  return { classes:[], students:[], staff:[], attendance:[], teacherNames:[], guardians:[], whatsappContacts:[], schoolType:'girls', reportSignatures:{manager:'',attendance:''} };
}
function emptyCloudStore(){
  return {classes:[],students:[],staff:[],attendance:[],teacherNames:[],guardians:[],whatsappContacts:[],schoolType:'girls',reportSignatures:{manager:'',attendance:''}};
}
function normalizeCloudStore(value){
  const out=Object.assign(emptyCloudStore(),value||{});
  ['classes','students','staff','attendance','teacherNames','guardians','whatsappContacts'].forEach(k=>{if(!Array.isArray(out[k]))out[k]=[];});
  if(!out.reportSignatures||typeof out.reportSignatures!=='object')out.reportSignatures={manager:'',attendance:''};
  if(typeof out.reportSignatures.manager!=='string')out.reportSignatures.manager='';
  if(typeof out.reportSignatures.attendance!=='string')out.reportSignatures.attendance='';
  if(!['boys','girls'].includes(out.schoolType))out.schoolType='girls';
  return out;
}
let cloudBaseline = null;
let cloudMetaExists = false;
let cloudRevision = 0;
let cloudDirty = false;
let cloudWriteQueue = Promise.resolve();
let localRevision = 0;
const CLOUD_ARRAY_FIELDS = ['classes','students','staff','attendance','guardians','whatsappContacts'];
function cloudRecordId(kind,item,index){
  // Attendance is keyed by class and date in this app, so keep its document ID stable even without a legacy record ID.
  const raw=item&&item.id!=null?String(item.id):(kind==='attendance'&&item?String(item.classId||'')+'_'+String(item.date||''):'legacy_'+index);
  return 'v2_'+kind+'_'+encodeURIComponent(raw);
}
function cloudRecordsFor(value){
  const out=new Map();
  CLOUD_ARRAY_FIELDS.forEach(kind=>{
    (value[kind]||[]).forEach((item,index)=>{
      const id=cloudRecordId(kind,item,index);
      out.set(id,{kind,record:item,order:index});
    });
  });
  return out;
}
function cloudMetaFor(value){
  return {kind:'meta',schemaVersion:2,schoolType:value.schoolType,teacherNames:value.teacherNames||[],reportSignatures:value.reportSignatures||{manager:'',attendance:''}};
}
function stableCloudJson(value){
  try{return JSON.stringify(value===undefined?null:value);}catch(e){return String(value);}
}
function saveStore(){
  if(!['boys','girls'].includes(store.schoolType))store.schoolType='girls';
  store=normalizeCloudStore(store);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(store));
  localRevision++; cloudDirty=true;
  if(db&&activeSchoolId&&session&&session.approved){
    setSyncIndicator('syncing');
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>syncStoreToCloud().catch(e=>console.error('Cloud save failed',e)),450);
  }
}
function cloneStoreSnapshot(){return JSON.parse(JSON.stringify(store));}
function resetCloudSyncState(schoolId){clearTimeout(saveTimer);saveTimer=null;cloudBaseline=null;cloudMetaExists=false;cloudRevision=0;cloudDirty=false;localRevision++;}
function restoreStoreSnapshot(snapshot){
  clearTimeout(saveTimer);saveTimer=null;
  store=normalizeCloudStore(snapshot);localRevision++;cloudDirty=true;
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(store));}catch(e){console.error('Local rollback failed',e);}
  if(db&&activeSchoolId&&session&&session.approved){
    saveTimer=setTimeout(()=>syncStoreToCloud().catch(e=>console.error('Cloud rollback sync failed',e)),3000);
  }
}
async function syncStoreToCloud(){
  if(!db||!activeSchoolId||!session||!session.approved){setSyncIndicator('disconnected');return {ok:false,offline:true,error:'Firebase غير متصل أو المدرسة غير محددة'};}
  if(!navigator.onLine){setSyncIndicator('disconnected');return {ok:false,offline:true,error:'لا يوجد اتصال بالإنترنت'};}
  setSyncIndicator('syncing');
  const requestedSchoolId=activeSchoolId;
  const run=async()=>{
    if(activeSchoolId!==requestedSchoolId||!session||!session.approved)return {ok:false,error:'تغير حساب المدرسة أثناء المزامنة'};
    const target=normalizeCloudStore(cloneStoreSnapshot());
    const revision=localRevision;
    const privateRef=db.collection('schools').doc(requestedSchoolId).collection('private');
    const base=normalizeCloudStore(cloudBaseline||emptyCloudStore());
    const baseRevision=Number(cloudRevision)||0;
    const oldRecords=cloudRecordsFor(base),newRecords=cloudRecordsFor(target);
    const writes=[];
    newRecords.forEach((value,id)=>{
      const old=oldRecords.get(id);
      if(!old||stableCloudJson(old.record)!==stableCloudJson(value.record)||old.kind!==value.kind||old.order!==value.order){
        writes.push({type:'set',id,data:{kind:'record',recordType:value.kind,record:value.record,order:value.order,schemaVersion:2,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}});
      }
    });
    oldRecords.forEach((value,id)=>{if(!newRecords.has(id))writes.push({type:'delete',id});});
    const oldMeta=cloudMetaFor(base),newMeta=cloudMetaFor(target);
    if(writes.length||stableCloudJson(oldMeta)!==stableCloudJson(newMeta)||!cloudMetaExists){
      writes.push({type:'set',id:'appMeta',merge:true,data:Object.assign({},newMeta,{revision:firebase.firestore.FieldValue.increment(1),updatedAt:firebase.firestore.FieldValue.serverTimestamp()})});
    }
    // Use multiple small batches; Firestore permits at most 500 writes per batch.
    for(let offset=0;offset<writes.length;offset+=400){
      const batch=db.batch();
      writes.slice(offset,offset+400).forEach(w=>{
        const ref=privateRef.doc(w.id);
        if(w.type==='delete')batch.delete(ref);else if(w.merge)batch.set(ref,w.data,{merge:true});else batch.set(ref,w.data);
      });
      await batch.commit();
    }
    cloudBaseline=target;
    const wroteMeta=writes.some(w=>w.id==='appMeta');
    if(wroteMeta)cloudRevision=baseRevision+1;
    cloudMetaExists=true;
    cloudDirty=(localRevision!==revision);
    if(cloudDirty){
      setSyncIndicator('syncing');
      clearTimeout(saveTimer);saveTimer=setTimeout(()=>syncStoreToCloud().catch(e=>console.error('Cloud follow-up save failed',e)),50);
    }else if(wroteMeta){
      // Read the committed revision back: another device may have written concurrently.
      try{
        const latestMeta=await privateRef.doc('appMeta').get();
        if(activeSchoolId===requestedSchoolId&&!cloudDirty&&latestMeta.exists){
          const actualRevision=Number((latestMeta.data()||{}).revision)||0;
          cloudRevision=actualRevision;
          if(actualRevision!==baseRevision+1)await pullFromServer(true);
        }
      }catch(revisionError){console.error('Cloud revision confirmation failed',revisionError);}
    }
    if(!cloudDirty)setSyncIndicator('synced');
    return {ok:true};
  };
  const queued=cloudWriteQueue.then(run,run);
  cloudWriteQueue=queued.then(()=>undefined,()=>undefined);
  return queued.catch(e=>{
    setSyncIndicator('disconnected');
    cloudDirty=true;
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>syncStoreToCloud().catch(err=>console.error('Cloud retry failed',err)),3000);
    throw e;
  });
}
async function syncStudentRecordToCloud(studentId){
  if(!db||!activeSchoolId||!session||!session.approved)return {ok:false,offline:true,error:'Firebase غير متصل أو المدرسة غير محددة'};
  // Initial migration must still upload the complete store once.
  if(!cloudMetaExists||!cloudBaseline)return syncStoreToCloud();
  // If anything besides this student changed locally, flush the whole pending change set first.
  const baseline=normalizeCloudStore(cloudBaseline),target=normalizeCloudStore(cloneStoreSnapshot());
  baseline.students=baseline.students.filter(st=>String(st.id)!==String(studentId));
  target.students=target.students.filter(st=>String(st.id)!==String(studentId));
  if(stableCloudJson(baseline)!==stableCloudJson(target))return syncStoreToCloud();
  const requestedSchoolId=activeSchoolId;
  const run=async()=>{
    if(activeSchoolId!==requestedSchoolId||!session||!session.approved)return {ok:false,error:'تغير حساب المدرسة أثناء المزامنة'};
    if(!cloudMetaExists||!cloudBaseline)return {ok:false,error:'لم تكتمل مزامنة المدرسة الأولية'};
    const index=(store.students||[]).findIndex(st=>String(st.id)===String(studentId));
    if(index<0)return {ok:false,error:'تعذر العثور على الطالبة بعد التعديل'};
    const revisionAtStart=localRevision,baseRevision=Number(cloudRevision)||0;
    const student=store.students[index],privateRef=db.collection('schools').doc(requestedSchoolId).collection('private');
    const batch=db.batch();
    batch.set(privateRef.doc(cloudRecordId('students',student,index)),{kind:'record',recordType:'students',record:student,order:index,schemaVersion:2,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    batch.set(privateRef.doc('appMeta'),Object.assign({},cloudMetaFor(store),{revision:firebase.firestore.FieldValue.increment(1),updatedAt:firebase.firestore.FieldValue.serverTimestamp()}),{merge:true});
    await batch.commit();
    if(activeSchoolId!==requestedSchoolId||!session||!session.approved)return {ok:false,error:'تغير حساب المدرسة أثناء المزامنة'};
    if(localRevision!==revisionAtStart){
      cloudDirty=true;
      clearTimeout(saveTimer);saveTimer=setTimeout(()=>syncStoreToCloud().catch(e=>console.error('Cloud follow-up save failed',e)),50);
      return {ok:true};
    }
    const nextBaseline=normalizeCloudStore(cloudBaseline);
    const oldIndex=nextBaseline.students.findIndex(st=>String(st.id)===String(studentId));
    if(oldIndex>=0)nextBaseline.students[oldIndex]=student;
    else nextBaseline.students.splice(index,0,student);
    cloudBaseline=nextBaseline;
    cloudRevision=baseRevision+1;cloudMetaExists=true;cloudDirty=localRevision!==revisionAtStart;
    if(cloudDirty){
      clearTimeout(saveTimer);saveTimer=setTimeout(()=>syncStoreToCloud().catch(e=>console.error('Cloud follow-up save failed',e)),50);
    }
    return {ok:true};
  };
  const queued=cloudWriteQueue.then(run,run);
  cloudWriteQueue=queued.then(()=>undefined,()=>undefined);
  return queued.catch(e=>{
    cloudDirty=true;
    throw e;
  });
}
async function syncAttendanceRecordToCloud(attendance){
  if(!db||!activeSchoolId||!session||!session.approved)return {ok:false,offline:true,error:'Firebase غير متصل أو المدرسة غير محددة'};
  if(!cloudMetaExists||!cloudBaseline)return syncStoreToCloud();
  const baseline=normalizeCloudStore(cloudBaseline),target=normalizeCloudStore(cloneStoreSnapshot());
  const sameSession=a=>String(a.classId)===String(attendance.classId)&&String(a.date)===String(attendance.date);
  baseline.attendance=baseline.attendance.filter(a=>!sameSession(a));
  target.attendance=target.attendance.filter(a=>!sameSession(a));
  if(stableCloudJson(baseline)!==stableCloudJson(target))return syncStoreToCloud();
  const requestedSchoolId=activeSchoolId;
  const run=async()=>{
    if(activeSchoolId!==requestedSchoolId||!session||!session.approved)return {ok:false,error:'تغير حساب المدرسة أثناء المزامنة'};
    if(!cloudMetaExists||!cloudBaseline)return {ok:false,error:'لم تكتمل مزامنة المدرسة الأولية'};
    // Freeze the exact attendance snapshot being committed. The live store may
    // change while Firestore is processing the batch; never mark those newer
    // local edits as part of the cloud baseline until they are written.
    const committedStore=normalizeCloudStore(cloneStoreSnapshot());
    const index=committedStore.attendance.findIndex(sameSession);
    if(index<0)return {ok:false,error:'تعذر العثور على الرصد بعد تسجيله'};
    const revisionAtStart=localRevision,baseRevision=Number(cloudRevision)||0;
    const record=committedStore.attendance[index],privateRef=db.collection('schools').doc(requestedSchoolId).collection('private');
    const attendanceRef=privateRef.doc(cloudRecordId('attendance',record,index));
    const batch=db.batch();
    batch.set(attendanceRef,{kind:'record',recordType:'attendance',record,order:index,schemaVersion:2,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    batch.set(privateRef.doc('appMeta'),Object.assign({},cloudMetaFor(store),{revision:firebase.firestore.FieldValue.increment(1),updatedAt:firebase.firestore.FieldValue.serverTimestamp()}),{merge:true});
    await batch.commit();
    if(activeSchoolId!==requestedSchoolId||!session||!session.approved)return {ok:false,error:'تغير حساب المدرسة أثناء المزامنة'};
    const savedSnapshot=await attendanceRef.get({source:'server'});
    const savedRecord=savedSnapshot.exists&&(savedSnapshot.data()||{}).record;
    const sameSavedRecord=!!savedRecord
      && String(savedRecord.classId)===String(record.classId)
      && String(savedRecord.date)===String(record.date)
      && String(savedRecord.teacher||'')===String(record.teacher||'')
      && String(savedRecord.time||'')===String(record.time||'')
      && Array.isArray(savedRecord.records)
      && savedRecord.records.length===record.records.length
      && record.records.every((item,i)=>{
        const saved=savedRecord.records[i];
        return saved&&String(saved.studentId)===String(item.studentId)
          && String(saved.studentName||'')===String(item.studentName||'')
          && String(saved.status)===String(item.status);
      });
    if(!sameSavedRecord)throw new Error('لم يتأكد حفظ مستند الرصد في Firestore');
    const nextBaseline=normalizeCloudStore(cloudBaseline);
    nextBaseline.attendance=committedStore.attendance;
    cloudBaseline=nextBaseline;cloudRevision=baseRevision+1;cloudMetaExists=true;cloudDirty=localRevision!==revisionAtStart;
    if(cloudDirty){
      clearTimeout(saveTimer);saveTimer=setTimeout(()=>syncStoreToCloud().catch(e=>console.error('Cloud follow-up save failed',e)),50);
    }else{
      // Reconcile a concurrent write from another device before the next poll.
      try{
        const latestMeta=await privateRef.doc('appMeta').get({source:'server'});

function privateRecordsOf(kind){

    rows.push({order:Number.isFinite(data.order)?data.order:rows.length,record:data.record});

function applyPrivateChanges(){

  // التغييرات الواردة تبقى في privateChangedIds وتُطبَّق بعد اكتمال الحفظ (فحص محلي فقط).

  if(revision===cloudRevision)return false;
  const kinds=new Set();let metaChanged=false;
  changed.forEach(id=>{
    if(id==='appMeta'){metaChanged=true;return;}
    const kind=recordKindFromId(id);
    if(kind&&CLOUD_ARRAY_FIELDS.includes(kind))kinds.add(kind);
  });
  const next=cloneStoreSnapshot();
  kinds.forEach(kind=>{next[kind]=privateRecordsOf(kind);});
  if(metaChanged){
    next.schoolType=meta.schoolType||'girls';
    next.teacherNames=Array.isArray(meta.teacherNames)?meta.teacherNames:[];
    next.reportSignatures=meta.reportSignatures||{manager:'',attendance:''};
  }
  store=normalizeCloudStore(next);

  const active=document.activeElement;

}

  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(s)));
  return Array.from(new Uint8Array(buf)).map(x=>x.toString(16).padStart(2,'0')).join('');
}

function studentUniqueKey(st){
  const cls=String(st.classId||'');
  const name=normalizeNameClient(st.name||'');
  return cls+'|'+(name || String(st.id||''));
}
function dedupeStudents(list){
  const seen=new Set(); const out=[];
  (list||[]).forEach(st=>{
    const key=studentUniqueKey(st);
    if(seen.has(key)) return;
    seen.add(key); out.push(st);
  });
  return out;
}
function studentsOfClass(classId){ return dedupeStudents(store.students.filter(s=>s.classId===classId)); }
function attendanceOf(classId, date){ return store.attendance.find(a=>a.classId===classId && a.date===(date||todayStr())); }
function classStats(cls){
  const total = studentsOfClass(cls.id).length;
  const att = attendanceOf(cls.id);
  const marked = att ? att.records.length : 0;
  const absent = att ? att.records.filter(r=>statusRank(r.status)===0).length : 0;
  const present = marked - absent;
  const pct = total ? Math.round((present/total)*100) : 0;
  return { total, marked, absent, present, pct };
}
function visibleClasses(){
  if(!session) return [];
  if(session.type==='admin') return store.classes;
  return store.classes.filter(c=> (session.classes||[]).includes(c.id));
}

function applyGenderLanguage(root){
  if(!root || store.schoolType !== 'boys') return;
  const pairs = [
    ['الطلاب والطالبات','الطلاب'],
    ['الطالبات','الطلاب'],
    ['الطالبة','الطالب'],
    ['الطالب/ة','الطالب'],
    ['ابنتكم','ابنكم'],
    ['المعلمات','المعلمين'],
    ['المعلمة','المعلم'],
    ['الإداريات','الإداريين'],
    ['الإدارية','الإداري'],
    ['اسحبي','اسحب'],
    ['امسحي','امسح'],
    ['اكتبي','اكتب'],
    ['ابحثي','ابحث'],
    ['اضغطي','اضغط'],
    ['حاضرات','حاضرون'],
    ['غائبات','غائبون'],
    ['حاضرة','حاضر'],
    ['غائبة','غائب'],
    ['غائبات:','غائبون:'],
    ['امسحي الكود','امسح الكود'],
    ['أضيفي','أضف'],
    ['اختاري','اختر'],
    ['أدخلي','أدخل'],
    ['اكتبي','اكتب']
  ];
  const translate = value => {
    let out = value;
    for(const [from,to] of pairs) out = out.split(from).join(to);
    return out;
  };
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node=>{ node.nodeValue = translate(node.nodeValue); });
  root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>{
    ['placeholder','title','aria-label'].forEach(attr=>{
      const val=el.getAttribute(attr);
      if(val) el.setAttribute(attr,translate(val));
    });
  });
}

    return studentsOfClass(c.id).some(s=> s.name.includes(q) || String(s.number||'').includes(q));

async function deleteClass(classId){
  const cls = store.classes.find(c=>c.id===classId);
  const count = studentsOfClass(classId).length;
  const msg = count>0
    ? `سيتم حذف فصل "${cls?cls.name:''}" مع جميع طالباته (${count}) وسجلات غيابه نهائياً. متابعة؟`
    : 'تأكيد حذف الفصل؟';
  if(!confirm(msg)) return;
  if(!auth || !auth.currentUser || !activeSchoolId || !session || !session.approved){
    toast('انتهت جلسة الدخول أو لا توجد صلاحية للحذف؛ سجلي الدخول مجددًا',true); return;
  }
  if(!confirm('تأكيد نهائي: سيتم حذف الفصل وبياناته من قاعدة البيانات. هل تريد المتابعة؟')) return;
  const snapshot=cloneStoreSnapshot();
  store.classes = store.classes.filter(c=>c.id!==classId);
  store.students = store.students.filter(s=>s.classId!==classId);
  store.attendance = store.attendance.filter(a=>a.classId!==classId);
  saveStore();
  const result=await persistStoreMutation('deleteClass', {id:classId},snapshot);
  if(!result.ok){render();toast('تعذر حذف الفصل من قاعدة البيانات؛ أُعيدت البيانات كما كانت',true);return;}
  render(); toast('تم حذف الفصل وجميع طالباته');
}
async function deleteTodayAttendance(classId){
  if(!confirm('حذف رصد اليوم لهذا الفصل؟')) return;
  const snapshot=cloneStoreSnapshot();
  store.attendance = store.attendance.filter(a=>!(a.classId===classId && a.date===todayStr()));
  saveStore();
  const result=await persistStoreMutation('deleteToday', {classId, date:todayStr()},snapshot);
  if(!result.ok){render();toast('تعذر حذف الرصد من قاعدة البيانات؛ أُعيدت البيانات كما كانت',true);return;}
  render(); toast('تم حذف رصد اليوم');
}

/* ---------- إضافة / تعديل فصل ---------- */
function cleanClassName(name, number){
  let value=String(name || '').trim();
  const num=String(number == null ? '' : number).trim();
  if(num && /^\d+$/.test(num)){
    value=value.replace(new RegExp('\\\\s*(?:[-/–—]\\\\s*|\\\\s+)'+num+'$'), '').trim();
  }
  return value;
}
function classDisplayName(c){
  const name=cleanClassName(c && c.name, c && c.number);
  const grade=Number(String(c && c.gradeNumber != null ? c.gradeNumber : '').trim());
  return Number.isSafeInteger(grade) && grade>0 ? `${name} ${grade}` : (name || String(c && c.name || ''));
}
function nextClassNumber(className, excludeId){
  const numbers=(store.classes || []).filter(c=>!excludeId || c.id!==excludeId).map(c=>{
    const value=String(c && c.number != null ? c.number : '').trim();
    if(!/^\d+$/.test(value)) return null;
    const n=Number(value);
    return Number.isSafeInteger(n) && n>=0 ? n : null;
  }).filter(n=>n!==null);
  return String((numbers.length ? Math.max(...numbers) : 0)+1);
}

      store.students.push(...newStudents);
      saveStore();
      const result=await persistStoreMutation('saveClassWithStudents', { classObj, students: newStudents },snapshot);
      if(!result.ok){close();render();toast('تعذر حفظ الفصل والطلاب في قاعدة البيانات؛ أُعيدت البيانات كما كانت',true);return;}
      toast('تم حفظ الفصل والطالبات في قاعدة البيانات');
    }
    close(); render();
  };
}


/* قراءة ملفات الاستيراد حسب نوعها، لتجنب عرض محتوى PDF وWord الثنائي كرموز */
function extractNamesFromExcel(sheets){
  const found = [];
  const seen = new Set();
  const isName = value => {
    const v = String(value ?? '').replace(/\s+/g,' ').trim();
    return v.length >= 2 && /[\u0600-\u06FFa-zA-Z]/.test(v) && !/^\d+$/.test(v);
  };
  for(const rows of sheets){
    if(!Array.isArray(rows) || !rows.length) continue;
    let headerRow = -1, nameCol = -1;
    for(let ri=0;ri<Math.min(rows.length,30);ri++){
      const row = rows[ri] || [];
      const ci = row.findIndex(v => /اسم\s*(الطالبة|الطالب|الاسم)|student\s*name|^name$/i.test(String(v ?? '').trim()));
      if(ci>=0){headerRow=ri;nameCol=ci;break;}
    }
    if(nameCol>=0){
      for(let ri=headerRow+1;ri<rows.length;ri++){
        const value=String((rows[ri]||[])[nameCol] ?? '').replace(/\s+/g,' ').trim();
        if(isName(value) && !seen.has(value)){seen.add(value);found.push(value);}
      }
      continue;
    }
    const maxCols=Math.max(0,...rows.map(row=>(row||[]).length));
    let bestCol=-1,bestScore=0;
    for(let ci=0;ci<maxCols;ci++){
      let score=0;
      for(const row of rows){
        const v=String((row||[])[ci] ?? '').replace(/\s+/g,' ').trim();
        if(isName(v) && !/^(الفصل|اسم الطالب\/ة|اسم الطالبة|اسم الطالب|رقم الطالب\/ة|رقم الطالبة|رقم الطالب|الصف|القسم|العام|الفصل الدراسي|م|مادة)$/i.test(v)) score++;
      }
      if(score>bestScore){bestScore=score;bestCol=ci;}
    }
    if(bestCol>=0){
      for(const row of rows){
        const value=String((row||[])[bestCol] ?? '').replace(/\s+/g,' ').trim();
        if(isName(value) && !/^(الفصل|اسم الطالب\/ة|اسم الطالبة|اسم الطالب|رقم الطالب\/ة|رقم الطالبة|رقم الطالب|الصف|القسم|العام|الفصل الدراسي|م|مادة)$/i.test(value) && !seen.has(value)){
          seen.add(value);found.push(value);
        }
      }
    }
  }
  return found;
}

async function readNamesImportFile(file){
  const name = String(file && file.name || '');
  const ext = (name.match(/\.([^.]+)$/) || [,''])[1].toLowerCase();
  if (['xlsx','xls'].includes(ext)) {
    if (!window.XLSX) throw new Error('مكتبة Excel غير متاحة');
    const buffer = await file.arrayBuffer();
    const wb = XLSX.read(buffer, {type:'array'});
    const sheets = wb.SheetNames.map(sheetName => XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:''}));
    return {kind:'excel', sheets};
  }
  if (ext === 'docx') {
    if (!window.mammoth) throw new Error('تعذر تحميل قارئ Word');
    const result = await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});
    return {kind:'text', text:result.value || ''};
  }
  if (ext === 'pdf') {
    if (!window.pdfjsLib) throw new Error('تعذر تحميل قارئ PDF');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    const lines = [];
    for (let pageNo=1; pageNo<=pdf.numPages; pageNo++) {
      const page = await pdf.getPage(pageNo);
      const content = await page.getTextContent();
      const groups = new Map();
      for (const item of content.items) {
        if (!item.str || !item.str.trim()) continue;
        const y = Math.round(item.transform[5]);
        if (!groups.has(y)) groups.set(y, []);
        groups.get(y).push({x:item.transform[4], text:item.str.trim()});
      }
      [...groups.keys()].sort((a,b)=>b-a).forEach(y=>{
        const line = groups.get(y).sort((a,b)=>b.x-a.x).map(x=>x.text).join(' ').trim();
        if (line) lines.push(line);
      });
    }
    let text = lines.join('\n');
    if (!text.trim()) {
      if(!window.Tesseract) throw new Error('هذا PDF عبارة عن صور. تعذّر تحميل قارئ OCR؛ جرّبي نسخة PDF نصية أو ملف Word.');
      const worker = await Tesseract.createWorker('ara');
      try{
        const ocrLines=[];
        for(let pageNo=1;pageNo<=pdf.numPages;pageNo++){
          const page=await pdf.getPage(pageNo);
          const viewport=page.getViewport({scale:2});
          const canvas=document.createElement('canvas');
          canvas.width=Math.ceil(viewport.width); canvas.height=Math.ceil(viewport.height);
          const ctx=canvas.getContext('2d');
          await page.render({canvasContext:ctx,viewport}).promise;
          const result=await worker.recognize(canvas);
          if(result && result.data && result.data.text) ocrLines.push(result.data.text);
          canvas.width=canvas.height=1;
        }
        text=ocrLines.join('\n');
      }finally{ await worker.terminate(); }
      if(!text.trim()) throw new Error('لم يتمكن OCR من قراءة أسماء من هذا الملف. جرّبي نسخة أوضح أو ملف Excel/Word.');
    }
    return {kind:'text', text};
  }
  if (['txt','csv'].includes(ext)) return {kind:'text', text:await file.text()};
  throw new Error('نوع الملف غير مدعوم. استخدمي PDF أو Excel أو Word بصيغة DOCX أو TXT أو CSV.');
}

  document.getElementById('addS').onclick = ()=> openStudentFormModal(classId, null, ()=>{ document.getElementById('studentsList').innerHTML = draw(); bindStudentRowEvents(); });

    document.querySelectorAll('[data-edit-student]').forEach(b=> b.onclick = ()=> openStudentFormModal(classId, store.students.find(s=>s.id===b.dataset.editStudent), ()=>{ document.getElementById('studentsList').innerHTML = draw(); bindStudentRowEvents(); }));
    document.querySelectorAll('[data-move-student]').forEach(b=> b.onclick = ()=> openStudentMoveModal(b.dataset.moveStudent, ()=>{ document.getElementById('studentsList').innerHTML = draw(); bindStudentRowEvents(); }));

function nextStudentNumber(classId, excludeId){
  const numbers = studentsOfClass(classId)
    .filter(s=>s.id!==excludeId)
    .map(s=>Number(String(s.number||'').trim()))
    .filter(n=>Number.isSafeInteger(n) && n>0);
  return String(Math.max(0, ...numbers)+1);
}

        </div>

      </div>
    </div>`;
  document.body.appendChild(wrap);
  const close=()=>{if(wrap.parentNode)wrap.parentNode.removeChild(wrap);};
  wrap.querySelector('#closeMoveStudent').onclick=close;
  wrap.querySelector('#cancelMoveStudent').onclick=close;
  wrap.querySelector('#moveStudentOverlay').onclick=e=>{if(e.target.id==='moveStudentOverlay')close();};
  wrap.querySelector('#confirmMoveStudent').onclick=async()=>{
    const targetClassId=wrap.querySelector('#moveStudentClass').value;
    const targetClass=store.classes.find(c=>String(c.id)===String(targetClassId));
    const current=store.students.find(s=>String(s.id)===String(studentId));
    if(!targetClass||!current){toast('تعذر العثور على الفصل أو الطالبة',true);return;}
    const button=wrap.querySelector('#confirmMoveStudent');button.disabled=true;

    close();onDone&&onDone();renderTopnav();toast(`تم نقل ${current.name} إلى ${classDisplayName(targetClass)} مع ترقيمها تلقائيًا`);
  };

    const snapshot=cloneStoreSnapshot();

      const oldName = existing.name;
      const updated = Object.assign({}, existing, {name, number, classId:clsId, guardianPhone, oldName});
      const result = await persistStoreMutation('saveStudent', updated,snapshot);
      if(!result.ok) { toast('تعذر حفظ التعديل في قاعدة البيانات؛ أُعيدت البيانات كما كانت', true); return; }
      toast('تم تحديث بيانات الطالب/ة ورقم ولي الأمر وحفظها في قاعدة البيانات');
    }else{
      const st = { id: uid(), classId: clsId, number, name, guardianPhone };
      const result = await persistStoreMutation('saveStudent', st,snapshot);
      if(!result.ok) { toast('تعذر حفظ الطالب/ة في قاعدة البيانات؛ أُعيدت البيانات كما كانت', true); return; }
      toast('تمت إضافة الطالب/ة ورقم ولي الأمر وحفظهما في قاعدة البيانات');

function toggleStudentAbsent(id){

function bindScan(){

  // Keep unsaved taps for the current scan instead of resetting them on every render.
  const context=scanContextKey();
  if(scanAbsentContext!==context){

  }
  const list = document.getElementById('studentsList');

  const session_ = { id: classId+'|'+todayStr(), classId, date: todayStr(), teacher, time: nowTimeStr(), records };
  store.attendance = store.attendance.filter(a=>!(a.classId===classId && a.date===todayStr()));

function publicVoteDocumentId(classId,date){return String(classId)+'_'+String(date);}
async function submitPublicScan(){
  const finishBtn=document.getElementById('finishScan');if(finishBtn)finishBtn.disabled=true;
  try{
    if(!firebaseReady||!auth||!db)throw new Error('التصويت غير متاح حالياً.');
    if(!auth.currentUser)await auth.signInAnonymously();
    const date=todayStr(),schoolId=route.schoolId,classId=route.classId;
    const absentIds=Array.from(scanAbsentSet).map(String);
    const ref=db.collection('schools').doc(schoolId).collection('publicAttendance').doc(publicVoteDocumentId(classId,date));
    await ref.set({classId,date,absentIds,votedAt:firebase.firestore.FieldValue.serverTimestamp()});
    route.publicDone=true;render();
  }catch(e){
    console.error('Public attendance vote failed',e);
    if(e&&e.code==='firestore/already-exists'){route.publicClosed=true;render();return;}
    toast(e&&e.code==='permission-denied'?'تم تسجيل الرصد لهذا الفصل اليوم أو أن الرابط لم يعد صالحاً.':'تعذر إرسال التصويت. تحققي من الاتصال ثم أعيدي المحاولة.',true);
    if(finishBtn)finishBtn.disabled=false;
  }
}
function speakThanks(teacher, absentCount){
  try{
    const greeting = (teacher && teacher!=='غير محدد') ? `شكراً لك ${teacher}، ` : 'شكراً لك، ';
    const girl=store.schoolType!=='boys';
    const absentLabel=girl?'الغائبات':'الطلاب الغائبين';
    const presentLabel=girl?'الطالبات':'الطلاب';
    const presentWord=girl?'حاضرات':'حاضرون';
    const msg = absentCount>0
      ? `${greeting}تم رصد الغياب بنجاح. عدد ${absentLabel} ${absentCount}.`
      : `${greeting}تم رصد الحضور. جميع ${presentLabel} ${presentWord}.`;
    const utter = new SpeechSynthesisUtterance(msg);
    utter.lang = 'ar-SA';
    speechSynthesis.cancel();
    speechSynthesis.speak(utter);
  }catch(e){}
}

async function publishPublicClass(cls){
  if(!db||!activeSchoolId||!session||!session.approved)return;
  const names={};studentsOfClass(cls.id).forEach(st=>{if(st.id&&st.name)names[String(st.id)]=String(st.name).slice(0,160);});
  if(Object.keys(names).length>500)throw new Error('لا يمكن نشر رابط لفصل يتجاوز 500 طالب/ة.');
  const data={classId:String(cls.id),className:String(classDisplayName(cls)).slice(0,160),schoolName:String(SCHOOL_NAME).slice(0,160),schoolType:store.schoolType==='boys'?'boys':'girls',students:names,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
  const existingAttendance=attendanceOf(cls.id,todayStr());
  if(existingAttendance){data.lastAttendanceDate=todayStr();data.lastAttendanceAbsentIds=(existingAttendance.records||[]).filter(r=>statusRank(r.status)===0).map(r=>String(r.studentId));}

async function loadPublicClass(schoolId,classId){
  try{
    if(!db||!classId)throw new Error('رابط الفصل غير مكتمل.');
    if(!schoolId){const link=await db.collection('publicClassLinks').doc(classId).get();if(!link.exists)throw new Error('رابط الفصل غير مفعّل. افتحي صفحة أكواد QR من المنصة أولاً.');schoolId=String((link.data()||{}).schoolId||'');}
    if(!schoolId)throw new Error('رابط الفصل غير مكتمل.');
    route.schoolId=schoolId;
    const ref=db.collection('schools').doc(schoolId).collection('publicClasses').doc(classId),snap=await ref.get();
    if(!snap.exists)throw new Error('رابط الفصل غير مفعّل. افتحي صفحة أكواد QR من المنصة أولاً.');
    const data=snap.data()||{},studentMap=data.students||{};
    store.classes=[{id:classId,name:String(data.className||'الفصل')}];
    store.students=Object.keys(studentMap).map((id,index)=>({id,classId,name:String(studentMap[id]||''),number:String(index+1)}));
    store.schoolType=data.schoolType==='boys'?'boys':'girls';SCHOOL_NAME=String(data.schoolName||'مدرسة');

    if(data.lastAttendanceDate===todayStr()){scanAbsentSet=new Set((data.lastAttendanceAbsentIds||[]).map(String));route.publicClosed=true;render();return;}
    const vote=await db.collection('schools').doc(schoolId).collection('publicAttendance').doc(publicVoteDocumentId(classId,todayStr())).get();
    if(vote.exists){scanAbsentSet=new Set(((vote.data()||{}).absentIds||[]).map(String));route.publicClosed=true;render();return;}
    render();
  }catch(e){console.error('Public class load failed',e);route.publicLoading=false;document.getElementById('app').innerHTML=`<div class="scan-wrap"><div class="empty"><b>تعذر فتح رابط الفصل</b>${esc(e&&e.message||'تحققي من الاتصال أو افتحي الرابط من جديد.')}</div></div>`;}
}
function mergePublicAttendanceIntoStore(schoolId,snapshot){

function qrPrintMarkup(source){
  if(!source) return '';
  const copy = source.cloneNode(true);
  const sourceBoxes = source.matches('.qr-box') ? [source] : Array.from(source.querySelectorAll('.qr-box'));
  const copyBoxes = copy.matches('.qr-box') ? [copy] : Array.from(copy.querySelectorAll('.qr-box'));
  for(let i=0;i<copyBoxes.length;i++){
    const sourceBox=sourceBoxes[i];
    const canvas=sourceBox?.querySelector('canvas');
    const image=sourceBox?.querySelector('img');
    let dataUrl='';
    try{if(canvas?.width && canvas?.height) dataUrl=canvas.toDataURL('image/png');}catch(e){}
    if(!dataUrl && image?.src?.startsWith('data:image/')) dataUrl=image.src;
    if(!dataUrl){toast('تعذّر تجهيز رمز QR للطباعة. حدّث الصفحة وحاول مرة أخرى.',true);return '';}
    copyBoxes[i].innerHTML=`<img src="${dataUrl}" width="180" height="180" alt="رمز QR" style="display:block;width:180px;height:180px;max-width:100%;object-fit:contain;margin:0 auto;print-color-adjust:exact;-webkit-print-color-adjust:exact;">`;
  }
  return copy.outerHTML;
}
function statusRank(s){ s=String(s||'').trim(); if(s==='غائبة'||s==='غائب'||s.toLowerCase()==='absent') return 0; if(s==='حاضرة'||s==='حاضر'||s.toLowerCase()==='present') return 1; return 2; }
// الغائبات أولاً ثم الحاضرات ثم غير المرصودات (مع الحفاظ على الترتيب الأصلي داخل كل مجموعة)
function sortAbsentFirst(rows, getStatus){ getStatus=getStatus||(r=>r.status); return rows.map((r,i)=>[r,i]).sort((a,b)=>statusRank(getStatus(a[0]))-statusRank(getStatus(b[0]))||a[1]-b[1]).map(x=>x[0]); }
function reportDateLabels(date=new Date()){
  let hijri='—', greg='—';
  try{hijri=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(date);}catch(e){}
  try{greg=new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(date);}catch(e){}
  return {hijri,greg};
}
function reportHijriForDate(dateStr){
  try{
    const parts=String(dateStr||'').split('-').map(Number);
    if(parts.length!==3||parts.some(n=>!Number.isFinite(n))) return '—';
    return reportDateLabels(new Date(parts[0],parts[1]-1,parts[2],12,0,0)).hijri;
  }catch(e){return '—';}
}
function reportGregorianForDate(dateStr){
  try{
    const parts=String(dateStr||'').split('-').map(Number);
    if(parts.length!==3||parts.some(n=>!Number.isFinite(n))) return '—';
    return reportDateLabels(new Date(parts[0],parts[1]-1,parts[2],12,0,0)).greg;
  }catch(e){return '—';}

function waitForReportImages(root,timeoutMs=10000){
  return Promise.all(Array.from(root.querySelectorAll('img')).map(img=>{
    if(img.complete)return img.naturalWidth>0?Promise.resolve():Promise.reject(new Error('تعذر تحميل صورة في التقرير'));
    return new Promise((resolve,reject)=>{
      let done=false;const finish=(ok)=>{if(done)return;done=true;clearTimeout(timer);img.removeEventListener('load',onLoad);img.removeEventListener('error',onError);ok?resolve():reject(new Error('تعذر تحميل صورة في التقرير'));};
      const onLoad=()=>finish(img.naturalWidth>0),onError=()=>finish(false),timer=setTimeout(()=>finish(false),timeoutMs);
      img.addEventListener('load',onLoad,{once:true});img.addEventListener('error',onError,{once:true});
    });
  }));
}
function printElement(html, title){
  html=String(html).replaceAll('الطالب/ة',reportStudentTerms().student);

  if(!w){toast('تعذر فتح نافذة الطباعة. اسمح بالنوافذ المنبثقة ثم أعد المحاولة.',true);return;}
  w.document.open();
  w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>${esc(title)}</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
    <style>@page{size:auto;margin:12mm}*{box-sizing:border-box}body{font-family:'Cairo',Arial,sans-serif;padding:18px;direction:rtl;color:#102a43}img{max-width:100%}table{border-collapse:collapse}thead{display:table-header-group}tr{page-break-inside:avoid}.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}.qr-card{border:2px solid #102a43;border-radius:14px;padding:18px;text-align:center;page-break-inside:avoid}.qr-card .qr-school{font-size:11px;color:#526575;font-weight:700}.qr-card .qr-class{font-size:18px;font-weight:800;color:#102a43;margin:6px 0 8px}.qr-card .qr-brand{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 12px;color:#102a43;font-size:12px;font-weight:800}.qr-card .qr-brand-mark{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:8px;background:#0f766e;color:#fff;font-size:14px;font-weight:900;-webkit-print-color-adjust:exact;print-color-adjust:exact}.qr-card .qr-box{display:flex;justify-content:center;margin-bottom:10px}.qr-card .qr-hint{font-size:11px;color:#0f766e;font-weight:700;margin-bottom:12px}.no-print{display:none!important}.qr-actions{display:none}</style>
    </head><body>${html}</body></html>`);
  w.document.close();
  const ready=()=>waitForReportImages(w.document).then(()=>new Promise(resolve=>w.requestAnimationFrame(()=>w.requestAnimationFrame(resolve)))).then(()=>{if(w.closed)return;w.focus();w.print();}).catch(error=>{console.error('Print preparation failed',error);toast('تعذر تجهيز التقرير للطباعة. تحقق من تحميل الشعار والصور.',true);});
  if(w.document.fonts?.ready)w.document.fonts.ready.then(ready).catch(ready);else ready();
}

    store.students=store.students.map(st=>{const g=map[normalizeNameClient(st.name)]; return g?Object.assign({},st,{guardianPhone:g.phone}):st;});

    guardianImportBusy = false;
    close(); toast(`تم الاستيراد: ${result.added||0} إضافة، ${result.updated||0} تحديث`);
  };

function reportPeriodBounds(period, date){
  const [y,m,d]=date.split('-').map(Number); const selected=new Date(y,m-1,d);
  if(period==='monthly') return {start:`${y}-${String(m).padStart(2,'0')}-01`,end:`${y}-${String(m).padStart(2,'0')}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`};
  if(period==='weekly'){
    const day=selected.getDay(); const from=new Date(y,m-1,d-day); const to=new Date(from); to.setDate(from.getDate()+6);
    const fmt=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
    return {start:fmt(from),end:fmt(to)};
  }
  return {start:date,end:date};
}

async function refreshMessageBadge(){
  const badge=document.getElementById('messageCount');
  if(!badge||!db||!activeSchoolId||!session||session.type!=='admin')return;
  try{
    const snap=await db.collection('schools').doc(activeSchoolId).collection('messages').where('readAt','==',null).get();
    if(badge.isConnected)badge.textContent=String(snap.size);
  }catch(e){console.warn('Message count refresh failed',e);}
}
function messageDateLabel(value){
  try{const date=value&&typeof value.toDate==='function'?value.toDate():null;return date?date.toLocaleString('ar-SA',{dateStyle:'medium',timeStyle:'short'}):'وصلت الآن';}catch(e){return 'وصلت الآن';}
}
async function loadSchoolMessages(){
  const root=document.getElementById('schoolMessages');if(!root||!db||!activeSchoolId)return;
  const requestedSchoolId=activeSchoolId;root.innerHTML='<div class="empty"><b>جارٍ تحميل الرسائل...</b></div>';
  try{
    const snap=await db.collection('schools').doc(requestedSchoolId).collection('messages').orderBy('sentAt','desc').limit(100).get();
    if(activeSchoolId!==requestedSchoolId||!root.isConnected)return;
    if(snap.empty){root.innerHTML='<div class="empty"><b>لا توجد رسائل حتى الآن</b>ستظهر هنا تحديثات وطلبات وتنبيهات إدارة المنصة.</div>';await refreshMessageBadge();return;}
    const categoryNames={update:'تحديث',request:'طلب',alert:'تنبيه'};
    root.innerHTML=snap.docs.map(doc=>{
      const m=doc.data()||{},unread=m.readAt==null;
      const attachment=m.attachment&&m.attachment.path?`<div class="message-attachment"><button class="btn btn-outline btn-sm" data-open-message-attachment="${esc(m.attachment.path)}">📎 فتح المرفق: ${esc(m.attachment.name||'ملف مرفق')}</button></div>`:'';
      return `<article class="message-card ${unread?'unread':''}"><h3>${esc(m.subject||'رسالة من المنصة')}</h3><div class="message-meta"><span>${esc(m.senderLabel||'إدارة المنصة')}</span><span class="message-tag">${esc(categoryNames[m.category]||'رسالة')}</span><time>${esc(messageDateLabel(m.sentAt))}</time>${unread?'<strong style="color:var(--teal)">غير مقروءة</strong>':'<span>مقروءة</span>'}</div><div class="message-body">${esc(m.body||'').replace(/\r?\n/g,'<br>')}</div>${attachment}<div class="message-actions">${unread?`<button class="btn btn-outline btn-sm" data-mark-message-read="${esc(doc.id)}">تحديد كمقروءة</button>`:''}<button class="btn btn-outline btn-sm message-delete" data-delete-message="${esc(doc.id)}" data-attachment-path="${esc(m.attachment?.path||'')}">حذف الرسالة</button></div></article>`;
    }).join('');
    root.querySelectorAll('[data-mark-message-read]').forEach(button=>button.onclick=()=>markSchoolMessageRead(button.dataset.markMessageRead,button));
    root.querySelectorAll('[data-delete-message]').forEach(button=>button.onclick=()=>deleteSchoolMessage(button.dataset.deleteMessage,button.dataset.attachmentPath,button));
    root.querySelectorAll('[data-open-message-attachment]').forEach(button=>button.onclick=()=>openSchoolMessageAttachment(button.dataset.openMessageAttachment,button));
    await refreshMessageBadge();
  }catch(e){console.error('Messages load failed',e);root.innerHTML='<div class="empty"><b>تعذر تحميل الرسائل</b>تحقق من الاتصال ثم أعد المحاولة.</div>';}
}
async function markSchoolMessageRead(messageId,button){
  if(!db||!activeSchoolId)return;
  button.disabled=true;
  try{
    await db.collection('schools').doc(activeSchoolId).collection('messages').doc(messageId).update({readAt:firebase.firestore.FieldValue.serverTimestamp()});
    await refreshMessageBadge();await loadSchoolMessages();
  }catch(e){console.error('Mark message read failed',e);toast('تعذر تحديث حالة الرسالة',true);button.disabled=false;}
}
function bindMessages(){document.getElementById('refreshMessages').onclick=loadSchoolMessages;loadSchoolMessages();}
async function openSchoolMessageAttachment(path,button){
  if(!path||!firebase.storage)return;
  const popup=window.open('about:blank','_blank');if(!popup){toast('اسمح بفتح النوافذ لعرض المرفق.',true);return;}
  button.disabled=true;
  try{popup.location=await firebase.storage().ref(path).getDownloadURL();}
  catch(e){popup.close();console.error('Attachment open failed',e);toast('تعذر فتح المرفق',true);}
  finally{button.disabled=false;}
}
async function deleteSchoolMessage(messageId,attachmentPath,button){
  if(!activeSchoolId||!db||!confirm('حذف هذه الرسالة من صندوق الوارد؟'))return;
  button.disabled=true;
  try{
    if(attachmentPath&&firebase.storage){try{await firebase.storage().ref(attachmentPath).delete();}catch(e){if(e.code!=='storage/object-not-found')throw e;}}
    await db.collection('schools').doc(activeSchoolId).collection('messages').doc(messageId).delete();
    toast('حُذفت الرسالة');await loadSchoolMessages();
  }catch(e){console.error('Message delete failed',e);toast('تعذر حذف الرسالة؛ تحقق من الاتصال ثم أعد المحاولة.',true);button.disabled=false;}
}
function bindAbsenceReport(){
  document.getElementById('loadReport').onclick=loadAbsenceReport;
  document.getElementById('reportRefresh').onclick=loadAbsenceReport;
  document.getElementById('allClassesReport').onclick=printAllClassesAbsenceReport;
  document.getElementById('whatsappContactReport').onclick=renderWhatsAppContactReport;
  document.getElementById('reportDate').onchange=e=>{document.getElementById('reportHijriReference').textContent='التاريخ الهجري: '+reportHijriForDate(e.target.value);};
  loadAbsenceReport();
}

function exportClassExcel(classId){
  const cls = store.classes.find(c=>c.id===classId);
  const studentTerms=reportStudentTerms();
  const students = studentsOfClass(classId).sort((a,b)=> (a.number||'').localeCompare(b.number||'', 'ar', {numeric:true}));
  const att = attendanceOf(classId);
  const rows = sortAbsentFirst(students, s=>{ const rec = att ? att.records.find(r=>r.studentId===s.id) : null; return rec ? rec.status : 'لم يُرصد'; }).map(s=>{
    const rec = att ? att.records.find(r=>r.studentId===s.id) : null;
    return {
      [studentTerms.studentNumber]: s.number,
      [studentTerms.studentName]: s.name,
      'رقم ولي الأمر': guardianPhoneForStudent(s),
      'الحالة': rec ? rec.status : 'لم يُرصد',
      'المعلمة': att ? att.teacher : '',
      'وقت الرصد': att ? att.time : '',
      'التاريخ': todayStr()
    };
  });
  const sign=store.reportSignatures||{};
  const ws = XLSX.utils.aoa_to_sheet([[SCHOOL_NAME],['تقرير الغياب اليومي — '+classDisplayName(cls)],['التاريخ الميلادي: '+reportDateLabels().greg],['التاريخ الهجري: '+reportDateLabels().hijri],['الساعة: '+nowTimeStr()],[],[studentTerms.studentNumber,studentTerms.studentName,'رقم ولي الأمر','الحالة','المعلمة','وقت الرصد','التاريخ'],...rows.map(r=>[r[studentTerms.studentNumber],r[studentTerms.studentName],r['رقم ولي الأمر'],r['الحالة'],r['المعلمة'],r['وقت الرصد'],r['التاريخ']]),[],[store.schoolType==='boys'?'مدير المدرسة':'مديرة المدرسة',sign.manager||'','التوقيع: ........................'],[],[store.schoolType==='boys'?'مسؤول الرصد':'مسؤولة الرصد',sign.attendance||'','التوقيع: ........................']]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'الغياب');
  XLSX.writeFile(wb, `تقرير_غياب_${classDisplayName(cls)}_${todayStr()}.xlsx`);
}
function exportClassPDF(classId){
  const cls = store.classes.find(c=>c.id===classId);
  const students = studentsOfClass(classId).sort((a,b)=> (a.number||'').localeCompare(b.number||'', 'ar', {numeric:true}));
  const att = attendanceOf(classId);
  const studentTerms=reportStudentTerms();
  const statusOf = s=>{ const rec = att ? att.records.find(r=>r.studentId===s.id) : null; return rec ? rec.status : 'لم يُرصد'; };
  const sortedStudents = sortAbsentFirst(students, statusOf);
  const rowsHtml = sortedStudents.map(s=>{
    const status = statusOf(s);
    const color = statusRank(status)===0 ? '#dc2626' : (statusRank(status)===1 ? '#16a34a' : '#8299a6');
    const guardianPhone = guardianPhoneForStudent(s);
    return `<tr><td>${esc(s.number)}</td><td>${esc(s.name)}</td><td>${guardianPhone?`<span class="guardian-phone">${esc(guardianPhone)}</span>`:'—'}</td><td style="color:${color}; font-weight:700;">${esc(status)}</td></tr>`;
  }).join('');
  const html = `
  <div style="font-family:'Cairo',sans-serif; direction:rtl; padding:10px;">
    <header style="display:flex;align-items:center;gap:18px;border-bottom:2px solid #0f766e;padding-bottom:14px;margin-bottom:16px;"><img src="${MINISTRY_LOGO_URL}" alt="شعار وزارة التعليم" style="width:92px;height:76px;object-fit:contain;"><div><h1 style="font-size:22px;color:#102a43;margin:0;">${esc(SCHOOL_NAME)}</h1><h2 style="color:#102a43;margin:5px 0;">تقرير غياب — ${esc(classDisplayName(cls))}</h2></div></header>
    <p style="color:#555; font-size:13px;">${esc(SCHOOL_NAME)} — التاريخ الميلادي: ${reportDateLabels().greg} — التاريخ الهجري: ${reportDateLabels().hijri} — الساعة: ${nowTimeStr()} ${att? '— المعلمة: '+esc(att.teacher)+' — وقت الرصد: '+esc(att.time):''}</p>
    <table style="width:100%; border-collapse:collapse; margin-top:14px;" border="1" cellpadding="8">
      <thead style="background:#102a43; color:#fff;"><tr><th>${studentTerms.studentNumber}</th><th>${studentTerms.studentName}</th><th>رقم ولي الأمر</th><th>الحالة</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    ${reportSignatureFooter()}
  </div>`;
  printElement(html, `تقرير غياب ${classDisplayName(cls)}`);
}

/* ==========================================================================
   بدء التشغيل + التعامل مع رابط ?class=
   ========================================================================== */
function init(){
  const params = new URLSearchParams(window.location.search);
  const cid = params.get('class');
  if(cid){
    const schoolId=params.get('school');
    route={name:'scanDeep',classId:cid,schoolId,publicLoading:true,publicMode:true};
    if(auth)auth.signInAnonymously().then(()=>loadPublicClass(schoolId,cid)).catch(e=>{console.error('Anonymous access unavailable',e);route.publicLoading=false;document.getElementById('app').innerHTML='<div class="scan-wrap"><div class="empty"><b>تعذر تفعيل التصويت دون تسجيل دخول</b>تحققي من تفعيل تسجيل الدخول المجهول في Firebase Authentication.</div></div>';});
    else{route.publicLoading=false;render();}
  }else{
    if(session) startAutoSync();
    render();
  }
}
window.navigate = navigate;
init();
