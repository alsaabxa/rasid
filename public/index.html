<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script>
/* ==========================================================================
   منصة راصد للغياب — تطبيق صفحة واحدة (SPA)
   مصدر البيانات السحابي: Firebase Authentication + Cloud Firestore.
   يحتفظ التطبيق بنسخة محلية مؤقتة لدعم الاستمرارية عند ضعف الاتصال.
   ========================================================================== */
let SCHOOL_NAME = "منصة راصد للمدارس";
const firebaseConfig = window.RASID_FIREBASE_CONFIG || {};
let auth = null, db = null, activeSchoolId = null, firebaseReady = false, saveTimer = null, pendingRegistration = false;
try {
  if (firebaseConfig.apiKey && firebaseConfig.projectId) {
    firebase.initializeApp(firebaseConfig); auth = firebase.auth(); db = firebase.firestore(); firebaseReady = true;
  }
} catch (e) { console.error('Firebase initialization failed', e); }
const SCHOOL_LOGO_DATA = 'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#102a43"/><text x="50" y="68" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="58" fill="#eab308">ر</text></svg>');
const MINISTRY_LOGO_URL = new URL('./assets/ministry-education.svg',location.href).href;
let STORAGE_KEY = "rasid_store_v1";
const SESSION_KEY = "rasid_session_v1";

/* ---------- state ---------- */
let store = loadStore();
let session = loadSession();
// Do not render a cached, unscoped store as an authenticated school's data.
let schoolDataReady = !auth;
let route = { name: session ? "dashboard" : "login" };
let dashboardQuery = '';
let pendingClassForScan = null; // used for ?class= deep link

function loadStore(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(!Array.isArray(parsed.teacherNames)) parsed.teacherNames = [];
      if(!Array.isArray(parsed.guardians)) parsed.guardians = [];
      if(!Array.isArray(parsed.whatsappContacts)) parsed.whatsappContacts = [];
      if(!parsed.reportSignatures || typeof parsed.reportSignatures !== 'object') parsed.reportSignatures = {manager:'', attendance:''};
      if(typeof parsed.reportSignatures.manager !== 'string') parsed.reportSignatures.manager = '';
      if(typeof parsed.reportSignatures.attendance !== 'string') parsed.reportSignatures.attendance = '';
      if(!['boys','girls'].includes(parsed.schoolType)) parsed.schoolType = 'girls';
      return parsed;
    }
  }catch(e){}
  return { classes:[], students:[], staff:[], attendance:[], teacherNames:[], guardians:[], whatsappContacts:[], schoolType:'girls', reportSignatures:{manager:'',attendance:''} };
}
function emptyCloudStore(){
  return {classes:[],students:[],staff:[],attendance:[],teacherNames:[],guardians:[],whatsappContacts:[],schoolType:'girls',reportSignatures:{manager:'',attendance:''}};
}
function normalizeCloudStore(value){
  const out=Object.assign(emptyCloudStore(),value||{});
  ['classes','students','staff','attendance','teacherNames','guardians','whatsappContacts'].forEach(k=>{if(!Array.isArray(out[k]))out[k]=[];});
  if(!out.reportSignatures||typeof out.reportSignatures!=='object')out.reportSignatures={manager:'',attendance:''};
  if(typeof out.reportSignatures.manager!=='string')out.reportSignatures.manager='';
  if(typeof out.reportSignatures.attendance!=='string')out.reportSignatures.attendance='';
  if(!['boys','girls'].includes(out.schoolType))out.schoolType='girls';
  return out;
}
let cloudBaseline = null;
let cloudMetaExists = false;
let cloudRevision = 0;
let cloudDirty = false;
let cloudWriteQueue = Promise.resolve();
let localRevision = 0;
const CLOUD_ARRAY_FIELDS = ['classes','students','staff','attendance','guardians','whatsappContacts'];
function cloudRecordId(kind,item,index){
  // Attendance is keyed by class and date in this app, so keep its document ID stable even without a legacy record ID.
  const raw=item&&item.id!=null?String(item.id):(kind==='attendance'&&item?String(item.classId||'')+'_'+String(item.date||''):'legacy_'+index);
  return 'v2_'+kind+'_'+encodeURIComponent(raw);
}
function cloudRecordsFor(value){
  const out=new Map();
  CLOUD_ARRAY_FIELDS.forEach(kind=>{
    (value[kind]||[]).forEach((item,index)=>{
      const id=cloudRecordId(kind,item,index);
      out.set(id,{kind,record:item,order:index});
    });
  });
  return out;
}
function cloudMetaFor(value){
  return {kind:'meta',schemaVersion:2,schoolType:value.schoolType,teacherNames:value.teacherNames||[],reportSignatures:value.reportSignatures||{manager:'',attendance:''}};
}
function stableCloudJson(value){
  try{return JSON.stringify(value===undefined?null:value);}catch(e){return String(value);}
}
function saveStore(){
  if(!['boys','girls'].includes(store.schoolType))store.schoolType='girls';
  store=normalizeCloudStore(store);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(store));
  localRevision++; cloudDirty=true;
  if(db&&activeSchoolId&&session&&session.approved){
    setSyncIndicator('syncing');
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>syncStoreToCloud().catch(e=>console.error('Cloud save failed',e)),450);
  }
}
function cloneStoreSnapshot(){return JSON.parse(JSON.stringify(store));}
function resetCloudSyncState(schoolId){clearTimeout(saveTimer);saveTimer=null;cloudBaseline=null;cloudMetaExists=false;cloudRevision=0;cloudDirty=false;localRevision++;}
function restoreStoreSnapshot(snapshot){
  clearTimeout(saveTimer);saveTimer=null;
  store=normalizeCloudStore(snapshot);localRevision++;cloudDirty=true;
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(store));}catch(e){console.error('Local rollback failed',e);}
  if(db&&activeSchoolId&&session&&session.approved){
    saveTimer=setTimeout(()=>syncStoreToCloud().catch(e=>console.error('Cloud rollback sync failed',e)),3000);
  }
}
async function syncStoreToCloud(){
  if(!db||!activeSchoolId||!session||!session.approved){setSyncIndicator('disconnected');return {ok:false,offline:true,error:'Firebase غير متصل أو المدرسة غير محددة'};}
  if(!navigator.onLine){setSyncIndicator('disconnected');return {ok:false,offline:true,error:'لا يوجد اتصال بالإنترنت'};}
  setSyncIndicator('syncing');
  const requestedSchoolId=activeSchoolId;
  const run=async()=>{
    if(activeSchoolId!==requestedSchoolId||!session||!session.approved)return {ok:false,error:'تغير حساب المدرسة أثناء المزامنة'};
    const target=normalizeCloudStore(cloneStoreSnapshot());
    const revision=localRevision;
    const privateRef=db.collection('schools').doc(requestedSchoolId).collection('private');
    const base=normalizeCloudStore(cloudBaseline||emptyCloudStore());
    const baseRevision=Number(cloudRevision)||0;
    const oldRecords=cloudRecordsFor(base),newRecords=cloudRecordsFor(target);
    const writes=[];
    newRecords.forEach((value,id)=>{
      const old=oldRecords.get(id);
      if(!old||stableCloudJson(old.record)!==stableCloudJson(value.record)||old.kind!==value.kind||old.order!==value.order){
        writes.push({type:'set',id,data:{kind:'record',recordType:value.kind,record:value.record,order:value.order,schemaVersion:2,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}});
      }
    });
    oldRecords.forEach((value,id)=>{if(!newRecords.has(id))writes.push({type:'delete',id});});
    const oldMeta=cloudMetaFor(base),newMeta=cloudMetaFor(target);
    if(writes.length||stableCloudJson(oldMeta)!==stableCloudJson(newMeta)||!cloudMetaExists){
      writes.push({type:'set',id:'appMeta',merge:true,data:Object.assign({},newMeta,{revision:firebase.firestore.FieldValue.increment(1),updatedAt:firebase.firestore.FieldValue.serverTimestamp()})});
    }
    // Use multiple small batches; Firestore permits at most 500 writes per batch.
    for(let offset=0;offset<writes.length;offset+=400){
      const batch=db.batch();
      writes.slice(offset,offset+400).forEach(w=>{
        const ref=privateRef.doc(w.id);
        if(w.type==='delete')batch.delete(ref);else if(w.merge)batch.set(ref,w.data,{merge:true});else batch.set(ref,w.data);
      });
      await batch.commit();
    }
    cloudBaseline=target;
    const wroteMeta=writes.some(w=>w.id==='appMeta');
    if(wroteMeta)cloudRevision=baseRevision+1;
    cloudMetaExists=true;
    cloudDirty=(localRevision!==revision);
    if(cloudDirty){
      setSyncIndicator('syncing');
      clearTimeout(saveTimer);saveTimer=setTimeout(()=>syncStoreToCloud().catch(e=>console.error('Cloud follow-up save failed',e)),50);
    }else if(wroteMeta){
      // Read the committed revision back: another device may have written concurrently.
      try{
        const latestMeta=await privateRef.doc('appMeta').get();
        if(activeSchoolId===requestedSchoolId&&!cloudDirty&&latestMeta.exists){
          const actualRevision=Number((latestMeta.data()||{}).revision)||0;
          cloudRevision=actualRevision;
          if(actualRevision!==baseRevision+1)await pullFromServer(true);
        }
      }catch(revisionError){console.error('Cloud revision confirmation failed',revisionError);}
    }
    if(!cloudDirty)setSyncIndicator('synced');
    return {ok:true};
  };
  const queued=cloudWriteQueue.then(run,run);
  cloudWriteQueue=queued.then(()=>undefined,()=>undefined);
  return queued.catch(e=>{
    setSyncIndicator('disconnected');
    cloudDirty=true;
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>syncStoreToCloud().catch(err=>console.error('Cloud retry failed',err)),3000);
    throw e;
  });
}
async function syncStudentRecordToCloud(studentId){
  if(!db||!activeSchoolId||!session||!session.approved)return {ok:false,offline:true,error:'Firebase غير متصل أو المدرسة غير محددة'};
  // Initial migration must still upload the complete store once.
  if(!cloudMetaExists||!cloudBaseline)return syncStoreToCloud();
  // If anything besides this student changed locally, flush the whole pending change set first.
  const baseline=normalizeCloudStore(cloudBaseline),target=normalizeCloudStore(cloneStoreSnapshot());
  baseline.students=baseline.students.filter(st=>String(st.id)!==String(studentId));
  target.students=target.students.filter(st=>String(st.id)!==String(studentId));
  if(stableCloudJson(baseline)!==stableCloudJson(target))return syncStoreToCloud();
  const requestedSchoolId=activeSchoolId;
  const run=async()=>{
    if(activeSchoolId!==requestedSchoolId||!session||!session.approved)return {ok:false,error:'تغير حساب المدرسة أثناء المزامنة'};
    if(!cloudMetaExists||!cloudBaseline)return {ok:false,error:'لم تكتمل مزامنة المدرسة الأولية'};
    const index=(store.students||[]).findIndex(st=>String(st.id)===String(studentId));
    if(index<0)return {ok:false,error:'تعذر العثور على الطالبة بعد التعديل'};
    const revisionAtStart=localRevision,baseRevision=Number(cloudRevision)||0;
    const student=store.students[index],privateRef=db.collection('schools').doc(requestedSchoolId).collection('private');
    const batch=db.batch();
    batch.set(privateRef.doc(cloudRecordId('students',student,index)),{kind:'record',recordType:'students',record:student,order:index,schemaVersion:2,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    batch.set(privateRef.doc('appMeta'),Object.assign({},cloudMetaFor(store),{revision:firebase.firestore.FieldValue.increment(1),updatedAt:firebase.firestore.FieldValue.serverTimestamp()}),{merge:true});
    await batch.commit();
    if(activeSchoolId!==requestedSchoolId||!session||!session.approved)return {ok:false,error:'تغير حساب المدرسة أثناء المزامنة'};
    if(localRevision!==revisionAtStart){
      cloudDirty=true;
      clearTimeout(saveTimer);saveTimer=setTimeout(()=>syncStoreToCloud().catch(e=>console.error('Cloud follow-up save failed',e)),50);
      return {ok:true};
    }
    const nextBaseline=normalizeCloudStore(cloudBaseline);
    const oldIndex=nextBaseline.students.findIndex(st=>String(st.id)===String(studentId));
    if(oldIndex>=0)nextBaseline.students[oldIndex]=student;
    else nextBaseline.students.splice(index,0,student);
    cloudBaseline=nextBaseline;
    cloudRevision=baseRevision+1;cloudMetaExists=true;cloudDirty=localRevision!==revisionAtStart;
    if(cloudDirty){
      clearTimeout(saveTimer);saveTimer=setTimeout(()=>syncStoreToCloud().catch(e=>console.error('Cloud follow-up save failed',e)),50);
    }
    return {ok:true};
  };
  const queued=cloudWriteQueue.then(run,run);
  cloudWriteQueue=queued.then(()=>undefined,()=>undefined);
  return queued.catch(e=>{
    cloudDirty=true;
    throw e;
  });
}
async function syncAttendanceRecordToCloud(attendance){
  if(!db||!activeSchoolId||!session||!session.approved)return {ok:false,offline:true,error:'Firebase غير متصل أو المدرسة غير محددة'};
  if(!cloudMetaExists||!cloudBaseline)return syncStoreToCloud();
  const baseline=normalizeCloudStore(cloudBaseline),target=normalizeCloudStore(cloneStoreSnapshot());
  const sameSession=a=>String(a.classId)===String(attendance.classId)&&String(a.date)===String(attendance.date);
  baseline.attendance=baseline.attendance.filter(a=>!sameSession(a));
  target.attendance=target.attendance.filter(a=>!sameSession(a));
  if(stableCloudJson(baseline)!==stableCloudJson(target))return syncStoreToCloud();
  const requestedSchoolId=activeSchoolId;
  const run=async()=>{
    if(activeSchoolId!==requestedSchoolId||!session||!session.approved)return {ok:false,error:'تغير حساب المدرسة أثناء المزامنة'};
    if(!cloudMetaExists||!cloudBaseline)return {ok:false,error:'لم تكتمل مزامنة المدرسة الأولية'};
    // Freeze the exact attendance snapshot being committed. The live store may
    // change while Firestore is processing the batch; never mark those newer
    // local edits as part of the cloud baseline until they are written.
    const committedStore=normalizeCloudStore(cloneStoreSnapshot());
    const index=committedStore.attendance.findIndex(sameSession);
    if(index<0)return {ok:false,error:'تعذر العثور على الرصد بعد تسجيله'};
    const revisionAtStart=localRevision,baseRevision=Number(cloudRevision)||0;
    const record=committedStore.attendance[index],privateRef=db.collection('schools').doc(requestedSchoolId).collection('private');
    const attendanceRef=privateRef.doc(cloudRecordId('attendance',record,index));
    const batch=db.batch();
    batch.set(attendanceRef,{kind:'record',recordType:'attendance',record,order:index,schemaVersion:2,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    batch.set(privateRef.doc('appMeta'),Object.assign({},cloudMetaFor(store),{revision:firebase.firestore.FieldValue.increment(1),updatedAt:firebase.firestore.FieldValue.serverTimestamp()}),{merge:true});
    await batch.commit();
    if(activeSchoolId!==requestedSchoolId||!session||!session.approved)return {ok:false,error:'تغير حساب المدرسة أثناء المزامنة'};
    const savedSnapshot=await attendanceRef.get({source:'server'});
    const savedRecord=savedSnapshot.exists&&(savedSnapshot.data()||{}).record;
    const sameSavedRecord=!!savedRecord
      && String(savedRecord.classId)===String(record.classId)
      && String(savedRecord.date)===String(record.date)
      && String(savedRecord.teacher||'')===String(record.teacher||'')
      && String(savedRecord.time||'')===String(record.time||'')
      && Array.isArray(savedRecord.records)
      && savedRecord.records.length===record.records.length
      && record.records.every((item,i)=>{
        const saved=savedRecord.records[i];
        return saved&&String(saved.studentId)===String(item.studentId)
          && String(saved.studentName||'')===String(item.studentName||'')
          && String(saved.status)===String(item.status);
      });
    if(!sameSavedRecord)throw new Error('لم يتأكد حفظ مستند الرصد في Firestore');
    const nextBaseline=normalizeCloudStore(cloudBaseline);
    nextBaseline.attendance=committedStore.attendance;
    cloudBaseline=nextBaseline;cloudRevision=baseRevision+1;cloudMetaExists=true;cloudDirty=localRevision!==revisionAtStart;
    if(cloudDirty){
      clearTimeout(saveTimer);saveTimer=setTimeout(()=>syncStoreToCloud().catch(e=>console.error('Cloud follow-up save failed',e)),50);
    }else{
      // Reconcile a concurrent write from another device before the next poll.
      try{
        const latestMeta=await privateRef.doc('appMeta').get({source:'server'});
        const actualRevision=latestMeta.exists?Number((latestMeta.data()||{}).revision)||0:baseRevision+1;
        cloudRevision=actualRevision;
        if(actualRevision!==baseRevision+1)await pullFromServer(true);
      }catch(revisionError){console.error('Attendance revision confirmation failed',revisionError);}
    }
    return {ok:true};
  };
  const queued=cloudWriteQueue.then(run,run);
  cloudWriteQueue=queued.then(()=>undefined,()=>undefined);

function qrPrintMarkup(source){
  if(!source) return '';
  const copy = source.cloneNode(true);
  const sourceBoxes = source.matches('.qr-box') ? [source] : Array.from(source.querySelectorAll('.qr-box'));
  const copyBoxes = copy.matches('.qr-box') ? [copy] : Array.from(copy.querySelectorAll('.qr-box'));
  for(let i=0;i<copyBoxes.length;i++){
    const sourceBox=sourceBoxes[i];
    const canvas=sourceBox?.querySelector('canvas');
    const image=sourceBox?.querySelector('img');
    let dataUrl='';
    try{if(canvas?.width && canvas?.height) dataUrl=canvas.toDataURL('image/png');}catch(e){}
    if(!dataUrl && image?.src?.startsWith('data:image/')) dataUrl=image.src;
    if(!dataUrl){toast('تعذّر تجهيز رمز QR للطباعة. حدّث الصفحة وحاول مرة أخرى.',true);return '';}
    copyBoxes[i].innerHTML=`<img src="${dataUrl}" width="180" height="180" alt="رمز QR" style="display:block;width:180px;height:180px;max-width:100%;object-fit:contain;margin:0 auto;print-color-adjust:exact;-webkit-print-color-adjust:exact;">`;
  }
  return copy.outerHTML;
}

function printElement(html, title){
  const w = window.open('', '_blank');
  if(!w){toast('اسمح بفتح النوافذ المنبثقة للطباعة ثم حاول مرة أخرى.',true);return;}
  html=String(html).replaceAll('الطالب/ة',reportStudentTerms().student);
  w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>${esc(title)}</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Cairo',sans-serif; padding:20px; direction:rtl;}
    .qr-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:20px;}
    .qr-card{border:2px solid #102a43; border-radius:14px; padding:18px; text-align:center; page-break-inside:avoid;}
    .qr-school{font-size:11px; color:#555;}
    .qr-class{font-size:18px; font-weight:800; color:#102a43; margin:6px 0 8px;}
    .qr-brand{display:flex; align-items:center; justify-content:center; gap:8px; margin:0 0 12px; color:#102a43; font-size:12px; font-weight:800;}
    .qr-brand-mark{display:inline-flex; width:24px; height:24px; align-items:center; justify-content:center; border-radius:8px; background:#0f766e; color:#fff; font-size:14px; font-weight:900;}
    .qr-box{display:flex; justify-content:center; margin-bottom:10px;}
    .qr-hint{font-size:11px; color:#0f766e; font-weight:700;}
    .qr-actions{display:none;}
  </style></head><body>${html}</body></html>`);
  w.document.close();
  const images=Array.from(w.document.images);
  const ready=images.map(img=>{
    if(img.complete && img.naturalWidth>0) return Promise.resolve();
    return new Promise(resolve=>{
      const done=()=>resolve();
      img.addEventListener('load',done,{once:true});
      img.addEventListener('error',done,{once:true});
      setTimeout(done,3000);
    });
  });
  Promise.all(ready).then(()=>{
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      if(w.closed) return;
      w.focus();
      w.print();
    }));
  });
}

function reportPeriodBounds(period, date){
  const [y,m,d]=date.split('-').map(Number); const selected=new Date(y,m-1,d);

  if(period==='weekly'){
    const day=selected.getDay(); const from=new Date(y,m-1,d-day); const to=new Date(from); to.setDate(from.getDate()+6);
    const fmt=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
    return {start:fmt(from),end:fmt(to)};
  }
  return {start:date,end:date};
}

function reportStatus(att, student){

}

  });

}

function viewMessages(){
  return `<div class="container"><div class="page-title"><div><h2>الرسائل</h2><p>رسائل الدعم وإدارة المنصة الخاصة بمدرستك</p></div><button class="btn btn-outline" id="refreshMessages">↻ تحديث الرسائل</button></div><div id="schoolMessages"><div class="empty"><b>جارٍ تحميل الرسائل...</b></div></div></div>`;
}
async function refreshMessageBadge(){
  const badge=document.getElementById('messageCount');
  if(!badge||!db||!activeSchoolId||!session||session.type!=='admin')return;
  try{
    const snap=await db.collection('schools').doc(activeSchoolId).collection('messages').where('readAt','==',null).get();
    if(badge.isConnected)badge.textContent=String(snap.size);
  }catch(e){console.warn('Message count refresh failed',e);}
}
function messageDateLabel(value){
  try{const date=value&&typeof value.toDate==='function'?value.toDate():null;return date?date.toLocaleString('ar-SA',{dateStyle:'medium',timeStyle:'short'}):'وصلت الآن';}catch(e){return 'وصلت الآن';}
}
async function loadSchoolMessages(){
  const root=document.getElementById('schoolMessages');if(!root||!db||!activeSchoolId)return;
  const requestedSchoolId=activeSchoolId;root.innerHTML='<div class="empty"><b>جارٍ تحميل الرسائل...</b></div>';
  try{
    const snap=await db.collection('schools').doc(requestedSchoolId).collection('messages').orderBy('sentAt','desc').limit(100).get();
    if(activeSchoolId!==requestedSchoolId||!root.isConnected)return;
    if(snap.empty){root.innerHTML='<div class="empty"><b>لا توجد رسائل حتى الآن</b>ستظهر هنا تحديثات وطلبات وتنبيهات إدارة المنصة.</div>';await refreshMessageBadge();return;}
    const categoryNames={update:'تحديث',request:'طلب',alert:'تنبيه'};
    root.innerHTML=snap.docs.map(doc=>{
      const m=doc.data()||{},unread=m.readAt==null;
      const attachment=m.attachment&&m.attachment.path?`<div class="message-attachment"><button class="btn btn-outline btn-sm" data-open-message-attachment="${esc(m.attachment.path)}">📎 فتح المرفق: ${esc(m.attachment.name||'ملف مرفق')}</button></div>`:'';
      return `<article class="message-card ${unread?'unread':''}"><h3>${esc(m.subject||'رسالة من المنصة')}</h3><div class="message-meta"><span>${esc(m.senderLabel||'إدارة المنصة')}</span><span class="message-tag">${esc(categoryNames[m.category]||'رسالة')}</span><time>${esc(messageDateLabel(m.sentAt))}</time>${unread?'<strong style="color:var(--teal)">غير مقروءة</strong>':'<span>مقروءة</span>'}</div><div class="message-body">${esc(m.body||'').replace(/\r?\n/g,'<br>')}</div>${attachment}<div class="message-actions">${unread?`<button class="btn btn-outline btn-sm" data-mark-message-read="${esc(doc.id)}">تحديد كمقروءة</button>`:''}<button class="btn btn-outline btn-sm message-delete" data-delete-message="${esc(doc.id)}" data-attachment-path="${esc(m.attachment?.path||'')}">حذف الرسالة</button></div></article>`;
    }).join('');
    root.querySelectorAll('[data-mark-message-read]').forEach(button=>button.onclick=()=>markSchoolMessageRead(button.dataset.markMessageRead,button));
    root.querySelectorAll('[data-delete-message]').forEach(button=>button.onclick=()=>deleteSchoolMessage(button.dataset.deleteMessage,button.dataset.attachmentPath,button));
    root.querySelectorAll('[data-open-message-attachment]').forEach(button=>button.onclick=()=>openSchoolMessageAttachment(button.dataset.openMessageAttachment,button));
    await refreshMessageBadge();
  }catch(e){console.error('Messages load failed',e);root.innerHTML='<div class="empty"><b>تعذر تحميل الرسائل</b>تحقق من الاتصال ثم أعد المحاولة.</div>';}
}
async function markSchoolMessageRead(messageId,button){
  if(!db||!activeSchoolId)return;
  button.disabled=true;
  try{
    await db.collection('schools').doc(activeSchoolId).collection('messages').doc(messageId).update({readAt:firebase.firestore.FieldValue.serverTimestamp()});
    await refreshMessageBadge();await loadSchoolMessages();
  }catch(e){console.error('Mark message read failed',e);toast('تعذر تحديث حالة الرسالة',true);button.disabled=false;}
}
function bindMessages(){document.getElementById('refreshMessages').onclick=loadSchoolMessages;loadSchoolMessages();}
async function openSchoolMessageAttachment(path,button){
  if(!path||!firebase.storage)return;
  const popup=window.open('about:blank','_blank');if(!popup){toast('اسمح بفتح النوافذ لعرض المرفق.',true);return;}
  button.disabled=true;
  try{popup.location=await firebase.storage().ref(path).getDownloadURL();}
  catch(e){popup.close();console.error('Attachment open failed',e);toast('تعذر فتح المرفق',true);}
  finally{button.disabled=false;}
}
async function deleteSchoolMessage(messageId,attachmentPath,button){
  if(!activeSchoolId||!db||!confirm('حذف هذه الرسالة من صندوق الوارد؟'))return;
  button.disabled=true;
  try{
    if(attachmentPath&&firebase.storage){try{await firebase.storage().ref(attachmentPath).delete();}catch(e){if(e.code!=='storage/object-not-found')throw e;}}
    await db.collection('schools').doc(activeSchoolId).collection('messages').doc(messageId).delete();
    toast('حُذفت الرسالة');await loadSchoolMessages();
  }catch(e){console.error('Message delete failed',e);toast('تعذر حذف الرسالة؛ تحقق من الاتصال ثم أعد المحاولة.',true);button.disabled=false;}
}
function bindAbsenceReport(){
  document.getElementById('loadReport').onclick=loadAbsenceReport;
  document.getElementById('reportRefresh').onclick=loadAbsenceReport;
  document.getElementById('allClassesReport').onclick=printAllClassesAbsenceReport;
  document.getElementById('whatsappContactReport').onclick=renderWhatsAppContactReport;
  document.getElementById('reportDate').onchange=e=>{document.getElementById('reportHijriReference').textContent='التاريخ الهجري: '+reportHijriForDate(e.target.value);};
  loadAbsenceReport();
}

/* ==========================================================================
   التصدير: Excel و PDF
   ========================================================================== */
function exportClassExcel(classId){
  const cls = store.classes.find(c=>c.id===classId);
  const studentTerms=reportStudentTerms();
  const students = studentsOfClass(classId).sort((a,b)=> (a.number||'').localeCompare(b.number||'', 'ar', {numeric:true}));
  const att = attendanceOf(classId);
  const rows = sortAbsentFirst(students, s=>{ const rec = att ? att.records.find(r=>r.studentId===s.id) : null; return rec ? rec.status : 'لم يُرصد'; }).map(s=>{
    const rec = att ? att.records.find(r=>r.studentId===s.id) : null;
    return {
      [studentTerms.studentNumber]: s.number,
      [studentTerms.studentName]: s.name,
      'رقم ولي الأمر': guardianPhoneForStudent(s),
      'الحالة': rec ? rec.status : 'لم يُرصد',
      'المعلمة': att ? att.teacher : '',
      'وقت الرصد': att ? att.time : '',
      'التاريخ': todayStr()
    };
  });
  const sign=store.reportSignatures||{};
  const ws = XLSX.utils.aoa_to_sheet([[SCHOOL_NAME],['تقرير الغياب اليومي — '+classDisplayName(cls)],['التاريخ الميلادي: '+reportDateLabels().greg],['التاريخ الهجري: '+reportDateLabels().hijri],['الساعة: '+nowTimeStr()],[],[studentTerms.studentNumber,studentTerms.studentName,'رقم ولي الأمر','الحالة','المعلمة','وقت الرصد','التاريخ'],...rows.map(r=>[r[studentTerms.studentNumber],r[studentTerms.studentName],r['رقم ولي الأمر'],r['الحالة'],r['المعلمة'],r['وقت الرصد'],r['التاريخ']]),[],['مدير / ة المدرسة',sign.manager||'','التوقيع: ........................'],[],['مسؤول / ة الرصد',sign.attendance||'','التوقيع: ........................']]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'الغياب');
  XLSX.writeFile(wb, `تقرير_غياب_${classDisplayName(cls)}_${todayStr()}.xlsx`);
}
function exportClassPDF(classId){
  const cls = store.classes.find(c=>c.id===classId);
  const students = studentsOfClass(classId).sort((a,b)=> (a.number||'').localeCompare(b.number||'', 'ar', {numeric:true}));
  const att = attendanceOf(classId);
  const studentTerms=reportStudentTerms();
  const statusOf = s=>{ const rec = att ? att.records.find(r=>r.studentId===s.id) : null; return rec ? rec.status : 'لم يُرصد'; };
  const sortedStudents = sortAbsentFirst(students, statusOf);
  const rowsHtml = sortedStudents.map(s=>{
    const status = statusOf(s);
    const color = statusRank(status)===0 ? '#dc2626' : (statusRank(status)===1 ? '#16a34a' : '#8299a6');
    const guardianPhone = guardianPhoneForStudent(s);
    return `<tr><td>${esc(s.number)}</td><td>${esc(s.name)}</td><td>${guardianPhone?`<span class="guardian-phone">${esc(guardianPhone)}</span>`:'—'}</td><td style="color:${color}; font-weight:700;">${esc(status)}</td></tr>`;
  }).join('');
  const html = `
  <div style="font-family:'Cairo',sans-serif; direction:rtl; padding:10px;">
    <header style="display:flex;align-items:center;gap:18px;border-bottom:2px solid #0f766e;padding-bottom:14px;margin-bottom:16px;"><img src="${MINISTRY_LOGO_URL}" alt="شعار وزارة التعليم" style="width:92px;height:76px;object-fit:contain;"><div><h1 style="font-size:22px;color:#102a43;margin:0;">${esc(SCHOOL_NAME)}</h1><h2 style="color:#102a43;margin:5px 0;">تقرير غياب — ${esc(classDisplayName(cls))}</h2></div></header>
    <p style="color:#555; font-size:13px;">${esc(SCHOOL_NAME)} — التاريخ الميلادي: ${reportDateLabels().greg} — التاريخ الهجري: ${reportDateLabels().hijri} — الساعة: ${nowTimeStr()} ${att? '— المعلمة: '+esc(att.teacher)+' — وقت الرصد: '+esc(att.time):''}</p>
    <table style="width:100%; border-collapse:collapse; margin-top:14px;" border="1" cellpadding="8">
      <thead style="background:#102a43; color:#fff;"><tr><th>${studentTerms.studentNumber}</th><th>${studentTerms.studentName}</th><th>رقم ولي الأمر</th><th>الحالة</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    ${reportSignatureFooter()}
  </div>`;
  printElement(html, `تقرير غياب ${classDisplayName(cls)}`);
}

   بدء التشغيل + التعامل مع رابط ?class=

function init(){
  const params = new URLSearchParams(window.location.search);
  const cid = params.get('class');
  if(cid){
    const schoolId=params.get('school');
    route={name:'scanDeep',classId:cid,schoolId,publicLoading:true,publicMode:true};
    if(auth)auth.signInAnonymously().then(()=>loadPublicClass(schoolId,cid)).catch(e=>{console.error('Anonymous access unavailable',e);route.publicLoading=false;document.getElementById('app').innerHTML='<div class="scan-wrap"><div class="empty"><b>تعذر تفعيل التصويت دون تسجيل دخول</b>تحققي من تفعيل تسجيل الدخول المجهول في Firebase Authentication.</div></div>';});
    else{route.publicLoading=false;render();}
  }else{
    if(session) startAutoSync();
    render();
  }
}
window.navigate = navigate;
init();
