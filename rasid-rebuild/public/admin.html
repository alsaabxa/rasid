<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اعتماد المدارس — راصد</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:Cairo,sans-serif;background:#f3f8f8;color:#183247;margin:0;padding:24px}.box{max-width:850px;margin:5vh auto;background:white;border-radius:18px;padding:24px;box-shadow:0 8px 28px #102a4318}h1{color:#102a43}.field{margin:12px 0}.field input{width:100%;padding:12px;border:1px solid #dbe6ec;border-radius:9px;box-sizing:border-box}button{font:inherit;border:0;border-radius:8px;padding:9px 15px;background:#0f766e;color:white;cursor:pointer;margin:3px}.danger{background:#b91c1c}.row{border:1px solid #dbe6ec;border-radius:10px;padding:14px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:14px}.muted{color:#607d8b;font-size:.9rem}#message{color:#b91c1c;min-height:1.4em}</style><div class="box"><h1>اعتماد تسجيل المدارس</h1><p class="muted">سجّل ببريد مدير المنصة الذي حددته في قواعد Firestore.</p><div id="login"><div class="field"><input id="email" type="email" placeholder="البريد الإلكتروني"></div><div class="field"><input id="password" type="password" placeholder="كلمة المرور"></div><button id="signIn">دخول الإدارة</button></div><div id="panel" hidden><button id="reload">تحديث الطلبات</button><button id="signOut">خروج</button><div id="requests"></div></div><p id="message"></p></div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="./firebase-config.js"></script><script>
let auth,db;try{firebase.initializeApp(window.ZAHRA_FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore()}catch(e){document.querySelector('#message').textContent='تحقق من إعداد firebase-config.js'}
const owner='__PLATFORM_OWNER_EMAIL__';const msg=t=>document.querySelector('#message').textContent=t;
auth&&auth.onAuthStateChanged(u=>{const matchesOwner=u&&u.email&&u.email.toLowerCase()===owner.toLowerCase(),ok=matchesOwner&&u.emailVerified;document.querySelector('#login').hidden=!!ok;document.querySelector('#panel').hidden=!ok;if(u&&!matchesOwner){auth.signOut();return}if(matchesOwner&&!u.emailVerified){auth.signOut();msg('تحقق من بريد مدير المنصة قبل إدارة الطلبات.');return}if(ok)load();});
document.querySelector('#signIn').onclick=async()=>{try{await auth.signInWithEmailAndPassword(document.querySelector('#email').value,document.querySelector('#password').value)}catch(e){msg('تعذر الدخول: '+e.message)}};
document.querySelector('#signOut').onclick=()=>auth.signOut();document.querySelector('#reload').onclick=load;
async function load(){try{const s=await db.collection('users').where('status','==','pending').get(),root=document.querySelector('#requests');root.innerHTML='';if(s.empty){root.innerHTML='<p class="muted">لا توجد طلبات معلقة.</p>';return}s.forEach(d=>{const p=d.data(),row=document.createElement('div');row.className='row';const info=document.createElement('div');info.innerHTML='<b></b><div class="muted"></div>';info.querySelector('b').textContent=p.schoolName||'مدرسة بلا اسم';info.querySelector('.muted').textContent=p.email||'';const actions=document.createElement('div');actions.innerHTML='<button>اعتماد</button><button class="danger">رفض</button>';actions.children[0].onclick=()=>decide(d.id,p,true);actions.children[1].onclick=()=>decide(d.id,p,false);row.append(info,actions);root.append(row)})}catch(e){msg('تعذر تحميل الطلبات: '+e.message)}}
async function decide(uid,p,approved){try{await db.collection('users').doc(uid).update({status:approved?'approved':'rejected',reviewedAt:firebase.firestore.FieldValue.serverTimestamp()});if(approved)await db.collection('schools').doc(uid).set({name:p.schoolName,schoolType:p.schoolType==='boys'?'boys':'girls',ownerUid:uid,status:'approved',createdAt:firebase.firestore.FieldValue.serverTimestamp()});msg(approved?'تم اعتماد المدرسة.':'تم رفض الطلب.');load()}catch(e){msg('تعذر تحديث الطلب: '+e.message)}}
</script></html>
